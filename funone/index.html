  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --rose:#F6C6D0;
    --rose-vif:#E2B77A;
    --lavande:#C9B6E4;
    --menthe:#A8E0D4;
    --jaune:#F7DE8C;
    --ink-onphoto:#FFF9F2;
    --encre:#4A1F2A;
    --body: 'Jost', system-ui, sans-serif;
  }
  body{ font-family:var(--body); color:var(--encre); background:#1d120c; height:100vh; height:100dvh; overflow:hidden;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #backdrop{ position:fixed; inset:0; z-index:0; background-image:var(--bg-img); background-size:cover; background-position:center;}
  #backdrop::after{ content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 0%, rgba(60,40,20,0.08), rgba(40,25,15,0.30) 75%), linear-gradient(180deg, rgba(50,30,15,0.18), rgba(35,20,10,0.30));}

  #particles{ position:fixed; inset:0; z-index:1; pointer-events:none;}
  .spark{ position:absolute; top:-14px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose-vif) 70%);
    box-shadow:0 0 6px 1px rgba(247,156,180,0.5); animation:fall linear infinite; opacity:0;}
  @keyframes fall{ 0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;} 8%{opacity:.9;} 50%{transform:translateY(55vh) translateX(-20px) rotate(120deg);} 92%{opacity:.55;} 100%{transform:translateY(112vh) translateX(16px) rotate(240deg); opacity:0;} }

  /* ---------- INTRO ---------- */
  #intro{ position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center;
    transition:opacity 1.3s ease, visibility 1.3s ease;}
  #intro video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.96;}
  #intro-overlay{ position:absolute; left:0; right:0; bottom:calc(9% + env(safe-area-inset-bottom,0px)); z-index:2; text-align:center; padding:0 1.2rem;}
  #enter-btn, #skip-btn{ font-family:'PacificoLocal','Pacifico', cursive; font-weight:400; font-size:1.35rem;
    color:#D9A94A; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.6);
    padding:.55rem 2rem .7rem; cursor:pointer; border-radius:999px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    text-shadow:0 0 10px rgba(255,255,255,.9), 0 1px 2px rgba(255,255,255,.8);
    transition:transform .25s ease, background .25s ease;}
  #enter-btn:hover{ transform:scale(1.04); background:rgba(255,255,255,.26);}
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none;}

  /* ---------- APP: single full-screen card ---------- */
  #app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity 1s ease .2s;}
  #app.show{ opacity:1;}
  #scroller{ position:absolute; inset:0; overflow-y:scroll; -webkit-overflow-scrolling:touch; scroll-snap-type:y mandatory; scroll-behavior:smooth;}
  .slide{ min-height:100vh; min-height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative;
    display:flex; align-items:center; justify-content:center;}
  .card-slide{ padding:2vh 2vw;}
  .cover-img{ display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
    border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .scroll-hint{ position:absolute; bottom:1rem; left:0; right:0; text-align:center; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.5); pointer-events:none;}
  .scroll-hint span{ display:block; font-family:var(--body); font-weight:600; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;}
  .chevron{ font-size:1.5rem; line-height:1; animation:bounce 1.8s ease-in-out infinite;}
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(7px);} }

  .info-slide{ padding:4rem 1.1rem 2.5rem;}
  .info-card{ width:100%; max-width:560px; background:rgba(255,249,242,.55); border:1.5px solid rgba(255,255,255,.75);
    border-radius:28px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 50px rgba(120,80,40,.25); padding:2rem 1.5rem; text-align:center; color:#4A1F2A;}
  .info-card h2{ font-family:var(--body); font-weight:800; font-size:1.7rem; line-height:1.2; color:#A8761F; margin-bottom:.3rem;}
  .info-card .host{ font-weight:600; color:#7A5A4A; margin-bottom:1rem;}
  .info-rows{ display:flex; flex-direction:column; gap:.7rem; margin-top:1.2rem; text-align:left;}
  .info-row{ display:flex; align-items:center; gap:.9rem; background:rgba(255,255,255,.55); border-radius:18px; padding:.8rem 1rem;}
  .info-row .ic{ font-size:1.4rem; flex:0 0 auto;}
  .info-row .ic.svg{ width:46px; height:46px; box-sizing:border-box; padding:11px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#B8862B; background:radial-gradient(circle at 35% 30%,#fffaf0,#f6e6c4); border:1px solid #C9922E; box-shadow:inset 0 0 0 3px rgba(255,255,255,.92), inset 0 0 0 4px rgba(201,146,46,.35), 0 3px 10px rgba(150,100,20,.18); } .info-row .ic.svg svg{ width:100%; height:100%; display:block; }
  .info-row .k{ font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#9A7335;}
  .info-row .v{ font-weight:600; font-size:1.05rem; color:#4A1F2A; word-break:break-word;}
  .info-row a{ color:inherit; text-decoration:underline; text-decoration-color:#D9A94A;}
  .info-row .nav-links{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem;}
  .info-row .nav-links a{ font-size:.78rem; font-weight:700; text-decoration:none; color:#fff; background:#A8761F; border-radius:999px; padding:.3rem .85rem;}
  .info-message{ margin-top:1.2rem; font-weight:500; line-height:1.5; color:#4A1F2A;}
  .prog{ margin-top:1.4rem; text-align:left;}
  .prog h3{ font-weight:800; font-size:1rem; color:#A8761F; text-align:center; margin-bottom:.6rem;}
  .prog-item{ display:flex; gap:.8rem; padding:.45rem 0; border-top:1px dashed rgba(168,118,31,.3);}
  .prog-item .t{ font-weight:800; color:#9A7335; min-width:3.4rem;}
  .prog-item .n{ font-weight:600;} .prog-item .d{ font-size:.9rem; opacity:.8;}

  .rsvp{ margin-top:1.6rem; padding-top:1.3rem; border-top:1.5px dashed rgba(168,118,31,.35); text-align:left;}
  .rsvp h3{ font-weight:800; font-size:1.15rem; color:#A8761F; text-align:center; margin-bottom:.8rem;}
  .rsvp label{ display:block; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#7C4A2A; margin:.8rem 0 .3rem;}
  .rsvp input[type=text], .rsvp input[type=number], .rsvp textarea{ width:100%; font-family:var(--body); font-size:1rem; font-weight:500; color:#4A1F2A;
    background:rgba(255,255,255,.7); border:1.5px solid rgba(168,118,31,.3); border-radius:14px; padding:.65rem .9rem; outline:none;}
  .rsvp input:focus, .rsvp textarea:focus{ border-color:#A8761F;}
  .rsvp textarea{ resize:vertical; min-height:70px;}
  .choice{ display:flex; gap:.6rem;}
  .choice label{ flex:1; margin:0; text-transform:none; letter-spacing:0; font-size:.95rem; color:#4A1F2A; background:rgba(255,255,255,.7);
    border:1.5px solid rgba(168,118,31,.3); border-radius:14px; padding:.7rem .5rem; text-align:center; cursor:pointer;}
  .choice input{ display:none;}
  .choice input:checked + span{ font-weight:800; color:#A8761F;}
  .choice label:has(input:checked){ border-color:#A8761F; background:#fff;}
  .rsvp button{ width:100%; margin-top:1.2rem; font-family:var(--body); font-weight:800; font-size:1.05rem; color:#fff; border:none; cursor:pointer;
    background:linear-gradient(135deg,#D9A94A,#A8761F); border-radius:999px; padding:.8rem 1rem; box-shadow:0 8px 22px rgba(168,118,31,.35);}
  .rsvp button:disabled{ opacity:.6; cursor:default;}
  .rsvp .note{ font-size:.95rem; font-weight:700; color:#A8761F; margin-top:.9rem; text-align:center; line-height:1.4;}
  .confirm{ text-align:center; padding:.6rem 0 .2rem;}
  .confirm-emoji{ font-size:2.4rem; margin-bottom:.2rem;}
  .confirm-title{ font-weight:800; font-size:1.3rem; color:#A8761F;}
  .confirm-recap{ margin-top:.6rem; font-weight:600; background:rgba(255,255,255,.7); border-radius:14px; padding:.6rem .8rem;}
  .confirm-when{ margin-top:.6rem; font-weight:600; color:#4A1F2A;}
  .confirm-fun{ margin-top:.8rem; font-weight:800; color:#A8761F;}
  .dupe{ background:#FFF6D9; border:1.5px solid #F2C94C; border-radius:16px; padding:.9rem; margin-top:1rem; text-align:center;}
  .dupe-title{ font-weight:800; color:#8A5A00; font-size:1.05rem;}
  .dupe-text{ margin:.4rem 0 .8rem; font-weight:600; font-size:.92rem; line-height:1.4; color:#5A4300;}
  .dupe button{ display:block; width:100%; margin-top:.5rem; font-family:var(--body); font-weight:800; font-size:.98rem; border-radius:999px; padding:.7rem 1rem; cursor:pointer;}
  .dupe .dupe-yes{ color:#fff; background:linear-gradient(135deg,#D9A94A,#A8761F); border:none; box-shadow:0 6px 16px rgba(168,118,31,.3);}
  .dupe .dupe-no{ color:#A8761F; background:#fff; border:1.5px solid #A8761F; box-shadow:none;}
  .dupe button:disabled{ opacity:.6;}
  .dupe-info{ text-align:center; font-weight:700; font-size:.9rem; color:#7A5A4A; background:rgba(255,255,255,.6); border-radius:12px; padding:.5rem .7rem; margin-bottom:.4rem;}
  .confirm-edit{ margin-top:1rem; background:none; border:none; color:#7C4A2A; font-family:var(--body); font-weight:700; font-size:.92rem; text-decoration:underline; cursor:pointer; width:auto; box-shadow:none; padding:.3rem;}
  .rsvp .done{ text-align:center; font-weight:700; color:#A8761F; padding:1rem 0;}
  .rsvp .err{ font-weight:700; font-size:.85rem; color:#B3261E; background:#FDECEF; border-radius:10px;
    padding:.35rem .7rem; margin-top:.4rem; text-align:left;}
  .rsvp input.invalid{ border-color:#D32F4F; box-shadow:0 0 0 3px rgba(211,47,79,.18);}
  .status{ color:#7A5A4A; font-weight:600; padding:1rem 0;}

  #music-toggle{ position:fixed; top:1.1rem; right:1.1rem; z-index:20; width:42px; height:42px; border-radius:50%;
    border:2px solid var(--rose-vif); background:rgba(50,30,15,.5); color:#fff; cursor:pointer; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;}


  /* ---------- THEME FUN TO BE ONE (1er anniversaire) ---------- */
  :root{ --brun:#7A3F12; --brun-doux:#9A5A22; --miel:#E3A92B; --miel-fonce:#C98A12; --creme:#FFF6E3; --menthe-f:#3FA595; --ciel:#5BB3D6; --rose-p:#F4A6B8; }
  body{ font-family:'Mali','Sriracha',system-ui,sans-serif; background:#fbeed6; }
  #backdrop::after{ background:linear-gradient(180deg, rgba(255,246,227,.30), rgba(255,236,205,.45)); }
  .spark{ width:9px; height:9px; border-radius:50%; background:#F4A6B8; box-shadow:0 0 6px 1px rgba(255,255,255,.7); }
  .spark:nth-child(4n+1){ background:#F6C84C; } .spark:nth-child(4n+2){ background:#8ED1E8; } .spark:nth-child(4n+3){ background:#9AD9C5; }
  #enter-btn, #skip-btn{ font-family:'Sriracha',cursive; font-size:1.55rem; line-height:1.15; padding:.5rem 2rem .6rem; border:2px solid var(--miel); border-radius:999px;
    background:rgba(255,246,227,.88); color:var(--brun); text-shadow:none; box-shadow:0 8px 24px rgba(122,63,18,.25); }
  #enter-btn:hover{ background:#fff; transform:scale(1.04); }
  #enter-btn span, #skip-btn span{ color:var(--brun); -webkit-text-fill-color:var(--brun); }
  #music-toggle{ border-color:var(--miel); background:rgba(255,246,227,.9); color:var(--brun); }

  /* carte */
  .card-slide{ flex-direction:column; padding:2vh 3vw 0; }
  .card{ position:relative; container-type:inline-size; width:min(94vw, calc((100dvh - 11dvh) * .75)); aspect-ratio:1086/1448; border-radius:16px; overflow:hidden;
    box-shadow:0 14px 40px rgba(122,63,18,.28), 0 0 0 1px rgba(227,169,43,.35); background:#fff3dc; margin-top:-2vh; }
  .card > img{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .zone{ position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; opacity:0; transition:opacity .5s ease; color:var(--brun); }
  .zone.ready{ opacity:1; }
  .zone > span{ display:inline-block; white-space:nowrap; }
  .ink{ color:#7A3F12; text-shadow:0 1px 0 rgba(255,255,255,.75), 0 0 8px rgba(255,246,225,.9); }
  #c-phrase{ left:22%; width:56%; top:31.4%; height:10%; font-family:'Sriracha',cursive; line-height:1.18; }
  #c-phrase > span{ white-space:pre-line; display:block; width:100%; }
  .line{ left:40.6%; width:35%; height:5.4%; justify-content:flex-start; text-align:left; font-family:'Mali',cursive; font-style:italic; font-weight:500; }
  .line > span{ padding:0 .1em; }
  #c-date{ top:44.9%; } #c-time{ top:49.8%; } #c-place{ top:54.5%; }
  #c-name{ left:26%; width:48%; top:82.2%; height:10%; font-family:'Sriracha',cursive; }
  .scroll-hint{ color:var(--brun); text-shadow:0 1px 6px rgba(255,246,227,.95); }
  .scroll-hint span{ font-family:'Mali',sans-serif; }

  /* infos + RSVP */
  .info-slide{ background:var(--bg-img) center/cover no-repeat; }
  .info-slide::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,246,227,.35),rgba(255,236,205,.55)); }
  .info-card{ position:relative; background:rgba(255,248,233,.93); border:2px solid rgba(227,169,43,.6); outline:2px dashed rgba(227,169,43,.4); outline-offset:-10px;
    border-radius:30px; box-shadow:0 18px 44px rgba(122,63,18,.22); color:var(--brun); padding:2.3rem 1.5rem; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .info-card h2{ font-family:'Sriracha',cursive; font-weight:400; font-size:2.1rem; line-height:1.2; color:var(--brun); padding:.05em .1em; }
  .info-card .host{ font-family:'Mali',sans-serif; font-weight:600; font-size:1.1rem; color:var(--brun-doux); }
  .info-row{ background:rgba(255,255,255,.7); border:1.5px solid rgba(227,169,43,.35); }
  .info-row .ic.svg{ color:var(--miel-fonce); background:#FFF3D1; border:1.5px solid rgba(227,169,43,.7); }
  .info-row .k{ color:var(--miel-fonce) !important; font-family:'Mali',sans-serif; font-weight:600; }
  .info-row .v{ font-family:'Mali',sans-serif; font-weight:500; font-size:1.02rem; color:var(--brun); }
  .info-row .nav-links a{ background:linear-gradient(135deg,#63C7B5,#3FA595); color:#fff; font-family:'Mali',sans-serif; font-weight:600; }
  .info-row a{ text-decoration-color:var(--miel); }
  .info-message{ font-family:'Mali',sans-serif; font-weight:500; font-size:1.02rem; color:var(--brun); }
  .prog h3,.rsvp h3,.confirm-title,.confirm-fun,.rsvp .note,.rsvp .done{ font-family:'Sriracha',cursive; font-weight:400; color:var(--brun); }
  .prog h3,.rsvp h3{ font-size:1.6rem; } .rsvp .note{ font-family:'Mali',sans-serif; font-weight:600; color:var(--brun-doux); }
  .prog-item{ border-top-color:rgba(227,169,43,.4); } .prog-item .t{ color:var(--miel-fonce); }
  .rsvp{ border-top:2px dashed rgba(227,169,43,.5); }
  .rsvp label{ color:var(--brun-doux); font-family:'Mali',sans-serif; font-weight:600; }
  .rsvp input[type=text], .rsvp input[type=number], .rsvp textarea{ font-family:'Mali',sans-serif; color:var(--brun); background:#fff; border:1.5px solid rgba(227,169,43,.5); }
  .rsvp input::placeholder, .rsvp textarea::placeholder{ color:rgba(122,63,18,.4); }
  .rsvp input:focus,.rsvp textarea:focus{ border-color:var(--miel-fonce); }
  .choice label{ color:var(--brun); background:#fff; border:1.5px solid rgba(227,169,43,.5); font-family:'Mali',sans-serif; font-weight:500; }
  .choice label:has(input:checked){ border-color:var(--menthe-f); background:#E9F8F4; } .choice input:checked + span{ color:var(--menthe-f); font-weight:600; }
  .rsvp button, .dupe .dupe-yes{ background:linear-gradient(135deg,#63C7B5,#3FA595); color:#fff; box-shadow:0 8px 20px rgba(63,165,149,.35); font-family:'Sriracha',cursive; font-weight:400; font-size:1.2rem; letter-spacing:.02em; }
  .dupe{ background:#FFF3D1; border-color:rgba(227,169,43,.7); } .dupe-title{ color:var(--brun); font-family:'Sriracha',cursive; font-weight:400; } .dupe-text{ color:var(--brun); }
  .dupe .dupe-no{ color:var(--menthe-f); background:#fff; border-color:var(--menthe-f); font-family:'Mali',sans-serif; }
  .dupe-info{ color:var(--brun); background:rgba(255,255,255,.7); }
  .confirm-recap{ background:#fff; color:var(--brun); } .confirm-when{ color:var(--brun); }
  .confirm-edit{ color:var(--brun-doux); font-family:'Mali',sans-serif; } .status{ color:var(--brun); }

  .cd{ margin:1.2rem 0 .3rem; }
  .cd-title{ font-family:'Mali',sans-serif; font-weight:600; font-size:1.05rem; color:var(--brun-doux); margin-bottom:.6rem; }
  .cd-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
  .cd-cell{ background:#fff; border:1.5px solid rgba(227,169,43,.5); border-radius:18px; padding:.6rem .15rem .5rem; box-shadow:0 3px 0 rgba(227,169,43,.25); }
  .cd-n{ display:block; font-family:'Sriracha',cursive; font-weight:400; font-size:2rem; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--brun); }
  .cd-cell:nth-child(1) .cd-n{ color:#E0A21E; } .cd-cell:nth-child(2) .cd-n{ color:#3FA595; } .cd-cell:nth-child(3) .cd-n{ color:#4BA3CC; } .cd-cell:nth-child(4) .cd-n{ color:#E57C98; }
  .cd-l{ display:block; font-family:'Mali',sans-serif; font-size:.6rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--brun-doux); margin-top:.2rem; }
  #skip-btn{ position:absolute; z-index:5; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; bottom:auto; left:auto; transform:none;
    font-family:'Mali',sans-serif; font-weight:600; letter-spacing:.02em; font-size:.9rem; line-height:1.2; padding:.25rem 1.05rem .32rem; border-width:1.5px; opacity:.92; }
  #skip-btn:hover{ transform:none; }
</style>

<script>
  // ---- particles ----
  const pWrap = document.getElementById('particles');
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (9+Math.random()*12)+'s';
    s.style.animationDelay = (Math.random()*12)+'s';
    pWrap.appendChild(s);
  }

  const video = document.getElementById('intro-video');
  video.load();

  const introEl = document.getElementById('intro');
  const appEl = document.getElementById('app');
  const enterBtn = document.getElementById('enter-btn');

  function enterSite(){
    introEl.classList.add('hidden');
    appEl.classList.add('show');
  }
  const bgm = document.getElementById('bg-music');
  bgm.loop = true;
  let started = false;
  function startWithSound(){
    if(started) return;
    started = true;
    document.getElementById('intro-overlay').style.display = 'none';
    bgm.play().catch(()=>{});          // silent unlock inside the tap (needed by phones)
    video.muted = !!musicUrl;          // custom music replaces the video's own sound
    video.currentTime = 0;
    video.play().catch(()=>{ enterSite(); });
    if(musicUrl) startMusic();
  }
  video.addEventListener('ended', enterSite);
  enterBtn.addEventListener('click', startWithSound);
  document.getElementById('skip-btn').addEventListener('click', ()=>{ startWithSound(); try{ video.pause(); }catch(_){} enterSite(); });

        const wrap = document.createElement('span');
        if(inv.contact_name) wrap.appendChild(document.createTextNode(inv.contact_name + (inv.contact_phone?' — ':'')));
        if(inv.contact_phone) wrap.appendChild(link('tel:'+inv.contact_phone.replace(/\s/g,''), inv.contact_phone));
        rows.appendChild(row('📞','Contact', wrap));
      }
      if(inv.dress_code) rows.appendChild(row('👗','Dress code', document.createTextNode(inv.dress_code)));
      if(rows.children.length) box.appendChild(rows);
      if(inv.message) box.appendChild(el('p','info-message', inv.message));

      if(inv.rsvp_enabled) box.appendChild(buildRsvp(inv));

      const prog = (inv.invitation_programme||[]).sort((a,b)=>a.position-b.position);
      if(prog.length){
        const p = el('div','prog'); p.appendChild(el('h3',null,'Programme'));
        prog.forEach(s=>{
          const it = el('div','prog-item'); it.appendChild(el('div','t', s.time||''));
          const w = el('div'); w.appendChild(el('div','n', s.title));
          if(s.description) w.appendChild(el('div','d', s.description));
          it.appendChild(w); p.appendChild(it);
        });
        box.appendChild(p);
      }
    }catch(e){
      box.textContent=''; box.appendChild(el('div','status','Impossible de charger les informations pour le moment.'));
    }
  }
  loadInfos();
</script>
</body>
</html>
