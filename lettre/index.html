:root{--ink:#0c0a09;--ivory:#f3ead8;--gold:#d8bd8a;--gold2:#b8975a;--wine:#7a1626;--wine2:#4d0b17}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--ivory);font-family:'Cormorant Garamond',serif;font-weight:500;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden;height:100svh}
/* ---------- fond photo ---------- */
#bg{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.6s ease .3s}
#bg img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:saturate(.85)}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,9,.6) 0%,rgba(12,10,9,.45) 35%,rgba(12,10,9,.75) 100%)}
body.open #bg{opacity:1}
/* ---------- intro : enveloppe ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
  background:radial-gradient(ellipse at 50% 40%,#2a1f1a 0%,#0c0a09 70%);transition:opacity 1.1s ease,visibility 1.1s}
#intro.out{opacity:0;visibility:hidden;pointer-events:none}
#intro .kicker{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.42em;text-transform:uppercase;font-size:11px;color:var(--gold);opacity:.85;text-align:center;padding:0 20px}
#intro .hint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--gold);opacity:.9;animation:pulse 2.2s ease-in-out infinite;transition:opacity .4s}
#intro.go .hint{opacity:0;animation:none}
@keyframes pulse{50%{opacity:.35}}
.stage{perspective:1100px;width:min(84vw,360px)}
.env{position:relative;width:100%;aspect-ratio:1.5/1;transform-style:preserve-3d;filter:drop-shadow(0 28px 38px rgba(0,0,0,.65));transition:transform 1.2s ease .6s}
.env>*{position:absolute}
.env-back{inset:0;background:#e6dac2;border-radius:3px}
.env-letter{z-index:2;left:6%;right:6%;top:6%;bottom:6%;background:linear-gradient(180deg,#fbf6ea,#efe5cf);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12%;gap:4px;color:#4a3a22;text-align:center;
  transition:transform 1.3s cubic-bezier(.3,.7,.2,1) .75s;box-shadow:0 0 0 1px rgba(184,151,90,.35) inset}
.env-letter .l1{font-family:'Jost',sans-serif;font-size:8px;letter-spacing:.34em;text-transform:uppercase;color:#8a7347}
.env-letter .l2{font-family:'Great Vibes',cursive;font-size:30px;line-height:1.1;color:#3d2e17}
.env-front{z-index:3;inset:0;background:linear-gradient(135deg,#efe6d2 0%,#e3d6bb 100%);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:3px}
.env-front::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.06),transparent 30%,transparent 70%,rgba(0,0,0,.06))}
.env-flap{left:0;top:0;width:100%;height:56%;background:linear-gradient(180deg,#eadfc7,#dccfb1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:4;
  transition:transform .95s cubic-bezier(.5,0,.2,1),z-index 0s .45s;backface-visibility:visible}
.seal{left:50%;top:56%;width:25%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent;transition:transform .3s,opacity .5s .1s}
.seal svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.seal:hover{transform:translate(-50%,-50%) scale(1.06)}
.seal .ring{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
#intro.go .seal{transform:translate(-50%,-50%) scale(1.35) rotate(-8deg);opacity:0;pointer-events:none}
#intro.go .env-flap{transform:rotateX(180deg);z-index:1}
#intro.go .env-letter{transform:translateY(-58%)}
#intro.go .env{transform:translateY(8vh) scale(1.05)}
/* ---------- page ---------- */
#app{position:relative;z-index:2;opacity:0;transition:opacity 1.2s ease .4s}
body.open #app{opacity:1}
section{position:relative;padding:72px 22px;max-width:560px;margin:0 auto}
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-top:40px;padding-bottom:40px}
.intro-t{font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.3em;text-transform:uppercase;font-size:11px;color:var(--gold);margin-bottom:26px;line-height:2;max-width:300px}
.nm{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(64px,22vw,104px);line-height:.98;color:#fbf3e1;text-shadow:0 4px 30px rgba(0,0,0,.55)}
.amp{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:var(--gold);margin:4px 0 2px}
.orn{width:120px;height:14px;margin:26px auto 22px;display:block;opacity:.9}
.when{font-size:23px;letter-spacing:.06em;color:#fbf3e1}
.where{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-top:12px}
.cue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);opacity:.8}
.cue i{width:1px;height:34px;background:linear-gradient(var(--gold),transparent);animation:drop 1.8s ease-in-out infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.glass{background:rgba(14,11,10,.52);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(216,189,138,.28);border-radius:4px;padding:34px 26px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:44px;color:var(--gold);line-height:1.1;margin-bottom:6px;text-align:center;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.sub{font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.38em;text-transform:uppercase;color:rgba(243,234,216,.85);text-align:center;margin-bottom:26px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.msg{font-size:21px;line-height:1.6;font-style:italic;color:#f3ead8}
/* reveal */
.rv{opacity:0;transform:translateY(38px);filter:blur(7px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter 1.1s ease;transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none;filter:none}
.rv.zoom{transform:scale(.92)}
/* compte à rebours */
.cd-title{font-family:'Jost',sans-serif;font-size:10.5px;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd-cell b{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:40px;line-height:1;color:#fbf3e1}
.cd-cell span{display:block;margin-top:8px;font-family:'Jost',sans-serif;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:rgba(243,234,216,.6)}
/* infos */
.info-row{display:flex;gap:16px;align-items:flex-start;text-align:left;padding:16px 0;border-top:1px solid rgba(216,189,138,.18)}
.info-row:first-child{border-top:0;padding-top:0}
.info-row .ic{flex:0 0 44px;height:44px;border:1px solid var(--gold2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.info-row .ic svg{width:21px;height:21px}
.info-row .k{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.info-row .v{font-size:20px;line-height:1.35;color:#fbf3e1}
.info-row .v a{color:var(--gold)}
.nav-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.nav-links a{font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;color:var(--ivory);border:1px solid var(--gold2);padding:9px 14px;border-radius:30px}
/* programme */
.tl{position:relative;margin:6px 0 0;padding-left:0}
.tl::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;width:1px;background:linear-gradient(var(--gold2),rgba(184,151,90,.15))}
.st{position:relative;display:flex;gap:20px;align-items:flex-start;text-align:left;padding:0 0 30px}
.st:last-child{padding-bottom:0}
.st .badge{flex:0 0 55px;height:55px;border-radius:50%;background:rgba(14,11,10,.9);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);position:relative;z-index:1;box-shadow:0 0 0 5px rgba(12,10,9,.55)}
.st .badge svg{width:27px;height:27px}
.st .tm{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.28em;color:var(--gold);margin-top:3px}
.st .tt{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;color:#fbf3e1;line-height:1.15;margin-top:2px}
.st .clip{display:block;margin-top:14px;width:min(100%,230px);aspect-ratio:3/4;object-fit:cover;border-radius:200px 200px 6px 6px;border:1px solid var(--gold2);box-shadow:0 14px 34px rgba(0,0,0,.5);background:#1a1411}
.st .ds{font-size:17.5px;font-style:italic;color:rgba(243,234,216,.75);line-height:1.4;margin-top:3px}
/* rsvp */
.rsvp{text-align:left}
.rsvp h3{font-family:'Great Vibes',cursive;font-weight:400;font-size:42px;color:var(--gold);text-align:center;margin-bottom:18px}
.rsvp label{display:block;font-family:'Jost',sans-serif;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin:16px 0 7px}
.rsvp input[type=text],.rsvp input[type=number],.rsvp textarea{width:100%;background:rgba(243,234,216,.06);border:1px solid rgba(216,189,138,.4);border-radius:3px;color:#fbf3e1;font-family:'Cormorant Garamond',serif;font-size:19px;padding:11px 13px;outline:0}
.rsvp textarea{min-height:80px;resize:vertical}
.rsvp input:focus,.rsvp textarea:focus{border-color:var(--gold)}
.rsvp .invalid{border-color:#e08a8a!important}
.rsvp .err{color:#f0a3a3;font-size:16px;margin-top:6px;font-style:italic}
.choice{display:grid;gap:8px}
.choice label{margin:0;text-transform:none;letter-spacing:0;font-family:'Cormorant Garamond',serif;font-size:19px;color:#fbf3e1}
.choice input{display:none}
.choice span{display:block;border:1px solid rgba(216,189,138,.4);border-radius:3px;padding:11px 14px;text-align:center;cursor:pointer;transition:.2s}
.choice input:checked+span{background:var(--gold);color:#1a130a;border-color:var(--gold);font-weight:600}
.rsvp button[type=submit],.dupe-yes,.dupe-no,.confirm-edit{width:100%;margin-top:22px;background:var(--gold);color:#1a130a;border:0;border-radius:30px;padding:15px;font-family:'Jost',sans-serif;font-weight:500;font-size:11px;letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
.rsvp button:disabled{opacity:.6}
.dupe-no,.confirm-edit{background:transparent;color:var(--gold);border:1px solid var(--gold2);margin-top:10px}
.rsvp .note{text-align:center;font-style:italic;font-size:16px;color:rgba(243,234,216,.6);margin-top:14px}
.dupe,.dupe-info{background:rgba(216,189,138,.1);border:1px solid rgba(216,189,138,.35);border-radius:3px;padding:14px;margin-top:16px;font-size:17px;text-align:center}
.dupe-title{font-weight:600;font-size:20px;margin-bottom:6px}
.confirm{text-align:center;padding:10px 0}
.confirm-emoji{font-size:44px}
.confirm-title{font-family:'Great Vibes',cursive;font-size:42px;color:var(--gold);margin:6px 0}
.confirm-recap,.confirm-when,.confirm-fun{font-size:19px;margin-top:8px}
.foot{text-align:center;padding:60px 22px 70px;font-family:'Great Vibes',cursive;font-size:38px;color:var(--gold)}
.status{text-align:center;padding:40px;font-style:italic}
/* musique */
#music-toggle{display:none;position:fixed;right:16px;top:16px;z-index:50;width:42px;height:42px;border-radius:50%;align-items:center;justify-content:center;background:rgba(12,10,9,.6);border:1px solid var(--gold2);color:var(--gold);font-size:18px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.open #music-toggle{z-index:60}
@media (prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none;filter:none}}

<body class="lock">
<div id="bg"><img id="bg-img" src="couple.jpg" alt=""></div>
<audio id="bg-music" playsinline></audio>
<button id="music-toggle" aria-label="Musique">♪</button>

<div id="intro">
  <div class="kicker" id="in-kicker">Une invitation vous attend</div>
  <div class="stage"><div class="env" id="env">
    <div class="env-back"></div>
    <div class="env-letter"><div class="l1">Vous êtes invités</div><div class="l2" id="in-names"></div></div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <button class="seal" id="seal" aria-label="Ouvrir l'invitation"></button>
  </div></div>
  <div class="hint" id="hint">Touchez le sceau pour ouvrir</div>
</div>

<main id="app"><div id="page"><div class="status">Chargement…</div></div></main>

<script>
const $ = id => document.getElementById(id);
const video = { muted:false };   // (compat avec le bloc musique)
let started = false;
const bgm = $('bg-music'); bgm.loop = true;
  // ---- Background music (chosen per invitation in Supabase) ----
  const SILENT = 'data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
  bgm.src = SILENT; bgm.dataset.src = 'silent';
  const musicBtn = document.getElementById('music-toggle');
  let musicUrl = null, musicPlaying = false;
  function updateBtn(){ musicBtn.textContent = musicPlaying ? '♫' : '♪'; musicBtn.style.opacity = musicPlaying ? '1' : '.75'; }
  let userPaused = false;
  function startMusic(){
    if(!musicUrl) return;
    if(bgm.dataset.src !== musicUrl){ bgm.src = musicUrl; bgm.dataset.src = musicUrl; }
    bgm.loop = true; bgm.muted = false; bgm.volume = 0.7;
    bgm.play().then(()=>{ musicPlaying = true; userPaused = false; updateBtn(); })
      .catch(()=>{ musicPlaying = false; updateBtn(); });   // blocked by the browser: retried at the next tap
  }
  // if the browser blocked the music, retry at the guest's next tap
  ['pointerdown','touchend','click'].forEach(ev => document.addEventListener(ev, ()=>{
    if(musicUrl && started && !musicPlaying && !userPaused) startMusic();
  }, {passive:true}));
  window.onMusicReady = function(url){ musicUrl = url; if(started){ musicBtn.style.display = 'flex'; startMusic(); } };
  musicBtn.addEventListener('click', function(){
    if(!musicUrl) return;
    if(bgm.paused || bgm.dataset.src !== musicUrl){ startMusic(); }
    else { bgm.pause(); musicPlaying = false; userPaused = true; updateBtn(); }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(musicPlaying) bgm.pause(); }
    else if(musicPlaying){ bgm.play().catch(()=>{}); }
  });
  function normName(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).sort().join(' '); }
  function link(href, text){ const a=el('a',null,text); a.href=href; a.target='_blank'; a.rel='noopener'; return a; }
  function buildRsvp(inv){
    const storeKey = 'rsvp_' + inv.id;
    let saved = null; try{ saved = JSON.parse(localStorage.getItem(storeKey) || 'null'); }catch(_){}
    const wrap = el('div','rsvp');
    wrap.appendChild(el('h3',null,'Confirmez votre présence'));
    const f = document.createElement('form');
    f.innerHTML = `
      <label for="r-name">Nom et prénom</label>
      <input type="text" id="r-name" maxlength="100" required autocomplete="name" placeholder="Prénom Nom">
      <label>Serez-vous présent(e) ?</label>
      <div class="choice">
        <label><input type="radio" name="att" value="yes" checked><span>Oui, avec joie 💍</span></label>
        <label><input type="radio" name="att" value="no"><span>Non, désolé(e)</span></label>
      </div>
      <div id="r-count-wrap">
        <label for="r-count">Nombre de personnes</label>
        <input type="number" id="r-count" min="1" max="20" inputmode="numeric" required placeholder="Ex. 2">
      </div>
      <label for="r-all">Allergies / remarques (facultatif)</label>
      <input type="text" id="r-all" maxlength="300">
      <label for="r-msg">Petit mot (facultatif)</label>
      <textarea id="r-msg" maxlength="500"></textarea>
      <button type="submit">Envoyer ma réponse</button>
      <div class="note">Nous avons hâte de célébrer avec vous ✨</div>`;
    wrap.appendChild(f);
    if(saved){
      f.querySelector('#r-name').value = saved.name || '';
      f.querySelector(saved.attending ? 'input[value=yes]' : 'input[value=no]').checked = true;
      f.querySelector('#r-count').value = saved.attending ? saved.count : '';
      f.querySelector('#r-count-wrap').style.display = saved.attending ? '' : 'none';
      f.querySelector('#r-count').required = !!saved.attending;
      f.querySelector('#r-all').value = saved.allergies || '';
      f.querySelector('#r-msg').value = saved.message || '';
      f.querySelector('button[type=submit]').textContent = 'Mettre à jour ma réponse';
      wrap.querySelector('h3').textContent = 'Votre réponse';
      const info = el('div','dupe-info','Vous avez déjà répondu : vous pouvez la modifier ci-dessous.');
      wrap.insertBefore(info, f);
    }
    f.addEventListener('change', ()=>{
      const yes = f.att.value==='yes';
      f.querySelector('#r-count-wrap').style.display = yes ? '' : 'none';
      f.querySelector('#r-count').required = yes;
    });
    f.noValidate = true;   // we show our own friendly messages
    f.addEventListener('input', (ev)=>{ ev.target.classList.remove('invalid'); const n = ev.target.nextElementSibling; if(n && n.classList.contains('err')) n.remove(); });
    f.addEventListener('submit', async (e)=>{
      e.preventDefault();
      f.querySelectorAll('.err').forEach(x=>x.remove());
      const yes = f.att.value==='yes';
      const nameVal = f.querySelector('#r-name').value.trim().replace(/\s+/g,' ');
      const countVal = parseInt(f.querySelector('#r-count').value,10);
      function showError(field, msg){
        const m = el('div','err',msg);
        field.insertAdjacentElement('afterend', m);                     // right under that field
        field.classList.add('invalid');
        return m;
      }
      const problems = [];
      if(nameVal.split(' ').filter(Boolean).length < 2) problems.push(showError(f.querySelector('#r-name'), "Merci d'indiquer votre nom et votre prénom."));
      if(yes && !(countVal >= 1 && countVal <= 20)) problems.push(showError(f.querySelector('#r-count'), "Merci d'indiquer le nombre de personnes (entre 1 et 20)."));
      if(problems.length){
        const first = problems[0].previousElementSibling;
        first.focus({preventScroll:true});
        problems[0].scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      const btn = f.querySelector('button[type=submit]');
      const data = { name: nameVal, attending: yes, count: yes ? countVal : 0,
        allergies: f.querySelector('#r-all').value.trim() || null, message: f.querySelector('#r-msg').value.trim() || null };
      f.querySelectorAll('.dupe').forEach(x=>x.remove());

      async function call(mode, matchId){
        if(PREVIEW) return { status:'created', id:'apercu' };   // aperçu : aucune écriture
        const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_rsvp', { method:'POST',
          headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
          body: JSON.stringify({ p_invitation_id: inv.id, p_name: data.name, p_attending: data.attending, p_count: data.count,
            p_allergies: data.allergies, p_message: data.message, p_mode: mode, p_match_id: matchId || null }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const r = await res.json();
        if(r.status === 'error') throw new Error('refused: '+r.reason);
        return r;
      }
      function finish(updated, id){
        try{ localStorage.setItem(storeKey, JSON.stringify({ id, name: data.name, attending: data.attending, count: data.count, allergies: data.allergies, message: data.message })); }catch(_){}
        wrap.textContent='';
        const ok = el('div','confirm');
        ok.appendChild(el('div','confirm-emoji', yes ? '💍' : '💌'));
        ok.appendChild(el('div','confirm-title', updated ? 'Réponse modifiée, merci !' : (yes ? "C'est noté, merci !" : 'Merci de nous avoir prévenus')));
        ok.appendChild(el('div','confirm-recap', data.name + ' — ' + (yes ? (data.count>1 ? 'présents ('+data.count+' personnes)' : 'présent(e)') : 'ne pourra pas venir')));
        if(yes && inv.event_date){
          const d = new Date(inv.event_date+'T12:00:00');
          let t = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
          ok.appendChild(el('div','confirm-when', 'Rendez-vous le ' + t + (inv.event_time ? ' à ' + inv.event_time : '')));
        }
        ok.appendChild(el('div','confirm-fun', yes ? 'À très vite pour célébrer notre amour ! 💛' : 'Vous allez nous manquer 💕'));
        const edit = el('button','confirm-edit','Modifier ma réponse'); edit.type = 'button';
        edit.addEventListener('click', ()=> wrap.replaceWith(buildRsvp(inv)));
        ok.appendChild(edit);
        wrap.appendChild(ok);
      }
      function failSend(){
        btn.disabled=false; btn.textContent = saved ? 'Mettre à jour ma réponse' : 'Envoyer ma réponse';
        f.insertBefore(el('div','err','Oups, l\'envoi a échoué. Réessayez dans un instant.'), btn);
      }
      function askModify(r){
        btn.disabled = false; btn.textContent = saved ? 'Mettre à jour ma réponse' : 'Envoyer ma réponse'; btn.style.display = 'none';
        const box = el('div','dupe');
        box.appendChild(el('div','dupe-title','Vous avez déjà répondu 🙂'));
        box.appendChild(el('div','dupe-text', 'Une réponse existe déjà au nom de « ' + r.match_name + ' ». Voulez-vous la modifier ? Ce que vous venez de saisir remplacera votre réponse précédente.'));
        const yesBtn = el('button','dupe-yes','Oui, modifier ma réponse'); yesBtn.type='button';
        const noBtn = el('button','dupe-no',"Non, c'est une autre personne"); noBtn.type='button';
        const lock = (t)=>{ yesBtn.disabled = noBtn.disabled = true; t.textContent = 'Envoi…'; };
        yesBtn.addEventListener('click', async ()=>{ lock(yesBtn); try{ const x = await call('update', r.match_id); finish(true, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        noBtn.addEventListener('click', async ()=>{ lock(noBtn); try{ const x = await call('new'); finish(false, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        box.appendChild(yesBtn); box.appendChild(noBtn);
        f.insertBefore(box, btn);
        box.scrollIntoView({behavior:'smooth', block:'center'});
      }

      btn.disabled = true; btn.textContent = 'Envoi…';
      try{
        let r;
        // this device already answered with the same name -> modify directly, no question asked
        if(saved && saved.id && normName(saved.name) === normName(data.name)) r = await call('update', saved.id);
        else r = await call('check');
        if(r.status === 'exists'){ askModify(r); return; }
        finish(r.status === 'updated', r.id);
      }catch(err){ failSend(); }
    });
    return wrap;
  }
  function buildNavLinks(inv, label){
    const box = el('div','nav-links');
    const q = encodeURIComponent(inv.address || label);
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    const isAndroid = /Android/.test(ua);
    function add(text, href){ const a = el('a', null, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); }
    if(!inv.address && inv.maps_url){ add('Itinéraire', inv.maps_url); return box; }
    add('Google Maps', 'https://www.google.com/maps/dir/?api=1&destination=' + q);
    add('Waze', 'https://waze.com/ul?q=' + q + '&navigate=yes');
    if(isIOS) add('Plans', 'https://maps.apple.com/?daddr=' + q);
    if(isAndroid) add('Autre appli', 'geo:0,0?q=' + q);
    return box;
  }
  function buildCountdown(inv){
    if(!inv.event_date) return document.createDocumentFragment();
    const [y,m,d] = inv.event_date.split('-').map(Number);
    let h = 0, mi = 0; const t = String(inv.event_time||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})?/); if(t){ h = +t[1]; mi = +(t[2]||0); }
    const target = new Date(y, m-1, d, h, mi, 0);
    const wrap = el('div','cd'), title = el('div','cd-title'), grid = el('div','cd-grid');
    const cells = ['jours','heures','minutes','secondes'].map(l=>{ const c = el('div','cd-cell'); const n = el('b','cd-n','00'); c.appendChild(n); c.appendChild(el('span','cd-l',l)); grid.appendChild(c); return n; });
    wrap.appendChild(title); wrap.appendChild(grid);
    let timer = null;
    function tick(){
      let s = Math.floor((target - new Date())/1000);
      if(s <= 0){
        const now = new Date();
        title.textContent = (now.getFullYear()===y && now.getMonth()===m-1 && now.getDate()===d) ? "C'est aujourd'hui !" : "L'événement a eu lieu ✨";
        grid.style.display = 'none'; if(timer) clearInterval(timer); return;
      }
      title.textContent = 'Rendez-vous dans'; grid.style.display = '';
      const dd = Math.floor(s/86400); s %= 86400; const hh = Math.floor(s/3600); s %= 3600; const mm = Math.floor(s/60), ss = s % 60;
      [dd,hh,mm,ss].forEach((v,i)=>{ cells[i].textContent = String(v).padStart(i===0 && dd>99 ? 3 : 2, '0'); });
    }
    timer = setInterval(tick, 1000); tick();
    return wrap;
  }
// ---------- sceau de cire ----------
function sealSvg(txt){
  let d=''; const N=72;
  for(let i=0;i<N;i++){ const a=i/N*Math.PI*2, r=45+2.6*Math.sin(a*7+.6)+1.4*Math.sin(a*13)+1.2*Math.sin(a*3);
    d += (i?'L':'M')+(50+r*Math.cos(a)).toFixed(1)+' '+(50+r*Math.sin(a)).toFixed(1); }
  return '<svg viewBox="0 0 100 100"><defs><radialGradient id="wg" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#b3283d"/><stop offset=".55" stop-color="#7a1626"/><stop offset="1" stop-color="#430914"/></radialGradient></defs>'+
  '<path d="'+d+'Z" fill="url(#wg)"/><circle class="ring" cx="50" cy="50" r="33" fill="none" stroke="#e4b9a0" stroke-opacity=".55" stroke-width="1.4"/>'+
  '<circle cx="50" cy="50" r="30" fill="none" stroke="#2c0509" stroke-opacity=".35" stroke-width="1"/>'+
  '<text x="50" y="60" text-anchor="middle" font-family="Great Vibes,cursive" font-size="30" fill="#f0c9b4" fill-opacity=".92">'+txt+'</text></svg>';
}
$('seal').innerHTML = sealSvg('♡');
// ---------- ouverture ----------
function openLetter(){
  if(started) return; started = true;
  bgm.play().catch(()=>{});

  const els = document.querySelectorAll('.rv:not(.in)');

  if(!io) io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } }), {threshold:.14, rootMargin:'0px 0px -6% 0px'});

}

function icon(name){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">'+(IC[name]||IC.star)+'</svg>'; }
function stepIcon(title){
  const t = String(title||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/ceremon|mairie|echange|voeux|engagement|benediction|nikah|henne/.test(t)) return 'rings';
  if(/accueil|arrivee|bienvenue|installation/.test(t)) return 'flower';
  if(/cocktail|apero|aperitif|vin d|champagne|boisson/.test(t)) return 'cocktail';
  if(/diner|dejeuner|repas|buffet|banquet|brunch/.test(t)) return 'dinner';
  if(/gateau|piece montee|dessert|cake/.test(t)) return 'cake';
  if(/soiree|danse|bal |bal$|dansante|dj|musique|ouverture du bal|fete/.test(t)) return 'dance';
  if(/photo|shooting|portrait/.test(t)) return 'camera';
  if(/lieu|trajet|navette|depart/.test(t)) return 'pin';
  if(/retrouvaille|surprise|feu d/.test(t)) return 'star';
  return 'heart';
}

const SUPABASE_KEY = 'sb_publishable_YdlXEbQn9ZqILsjT6pyAug_ijgzm5fQ';

  function waitLive(){ return new Promise(function(res){

function frDate(inv){

  return t.charAt(0).toUpperCase()+t.slice(1);
}
function splitNames(inv){
  const t = inv.card_text || {};

  const p = raw.split(/\s+(?:et|&)\s+/i).map(s=>s.trim()).filter(Boolean);
  return p.length>=2 ? [p[0], p.slice(1).join(' & ')] : [raw, ''];
}

function section(cls){ const s = document.createElement('section'); if(cls) s.className = cls; return s; }

// ---------- mini-vidéos du programme (lecture quand visibles) ----------
let vio = null;
function mkClip(c){
  const v = document.createElement('video'); v.className='clip'; v.muted = true; v.loop = true; v.playsInline = true; v.preload='metadata';
  v.setAttribute('muted',''); v.setAttribute('playsinline','');
  if(c.webm){ const a=document.createElement('source'); a.src=c.webm; a.type='video/webm'; v.appendChild(a); }
  const b=document.createElement('source'); b.src=c.mp4; b.type='video/mp4'; v.appendChild(b);
  if('IntersectionObserver' in window){
    vio = vio || new IntersectionObserver(es=>es.forEach(e=>{ const x=e.target; if(e.isIntersecting){ x.play().catch(()=>{}); } else x.pause(); }), {threshold:.35});
    vio.observe(v);
  } else v.autoplay = true;
  return v;
}
function render(inv){
  const page = $('page'); page.textContent = '';

  const ornw = rv(el('div'), .6); ornw.innerHTML = ORN; hero.appendChild(ornw);

  if(inv.event_date){

  }
  // 4. informations
  {

    if(inv.event_time) rows.appendChild(row('clock','Heure', document.createTextNode(inv.event_time)));

    }
    if(inv.dress_code) rows.appendChild(row('dress','Dress code', document.createTextNode(inv.dress_code)));
    if(inv.contact_name || inv.contact_phone){
      const w = document.createElement('span');

      if(inv.contact_phone){ const a=el('a',null,inv.contact_phone); a.href='tel:'+inv.contact_phone.replace(/\s/g,''); w.appendChild(a); }
      rows.appendChild(row('phone','Contact', w));
    }
    if(rows.children.length){
      const s = section(); const h=rv(el('div')); h.appendChild(el('h2',null,'Les détails')); h.appendChild(el('div','sub','Pour ne rien manquer')); s.appendChild(h);
      const g = rv(el('div','glass'),.1); g.style.textAlign='left'; g.appendChild(rows); s.appendChild(g); page.appendChild(s);
    }
  }
  // 5. programme
  const prog = (inv.invitation_programme||[]).slice().sort((a,b)=>a.position-b.position);

    const s = section(); const h=rv(el('div')); h.appendChild(el('h2',null,'Le programme')); h.appendChild(el('div','sub','Le fil de notre journée')); s.appendChild(h);
    const tl = el('div','tl');
    let clips = (Array.isArray(inv.media)?inv.media:[]).filter(m=>m&&m.url&&m.kind==='video').map(m=>({mp4:m.url}));
    if(!clips.length && /-demo$/.test(inv.slug||'')) clips = [1,2,3,4,5].map(n=>({mp4:'v/step'+n+'.mp4', webm:'v/step'+n+'.webm'}));
    let ci = 0;
    prog.forEach(p=>{
      const st = rv(el('div','st'), 0);
      const b = el('div','badge'); b.innerHTML = icon(stepIcon(p.title)); st.appendChild(b);
      const t = el('div'); if(p.time) t.appendChild(el('div','tm',p.time)); t.appendChild(el('div','tt',p.title));
