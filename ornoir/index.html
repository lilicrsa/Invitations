  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --rose:#F6C6D0;
    --rose-vif:#E2B77A;
    --lavande:#C9B6E4;
    --menthe:#A8E0D4;
    --jaune:#F7DE8C;
    --ink-onphoto:#FFF9F2;
    --encre:#4A1F2A;
    --body: 'Jost', system-ui, sans-serif;
  }
  body{ font-family:var(--body); color:var(--encre); background:#1d120c; height:100vh; height:100dvh; overflow:hidden;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #backdrop{ position:fixed; inset:0; z-index:0; background-image:var(--bg-img); background-size:cover; background-position:center;}
  #backdrop::after{ content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 0%, rgba(60,40,20,0.08), rgba(40,25,15,0.30) 75%), linear-gradient(180deg, rgba(50,30,15,0.18), rgba(35,20,10,0.30));}

  #particles{ position:fixed; inset:0; z-index:1; pointer-events:none;}
  .spark{ position:absolute; top:-14px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose-vif) 70%);
    box-shadow:0 0 6px 1px rgba(247,156,180,0.5); animation:fall linear infinite; opacity:0;}
  @keyframes fall{ 0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;} 8%{opacity:.9;} 50%{transform:translateY(55vh) translateX(-20px) rotate(120deg);} 92%{opacity:.55;} 100%{transform:translateY(112vh) translateX(16px) rotate(240deg); opacity:0;} }

  /* ---------- INTRO ---------- */
  #intro{ position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center;
    transition:opacity 1.3s ease, visibility 1.3s ease;}
  #intro video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.96;}
  #intro-overlay{ position:absolute; left:0; right:0; bottom:calc(9% + env(safe-area-inset-bottom,0px)); z-index:2; text-align:center; padding:0 1.2rem;}
  #enter-btn, #skip-btn{ font-family:'PacificoLocal','Pacifico', cursive; font-weight:400; font-size:1.35rem;
    color:#D9A94A; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.6);
    padding:.55rem 2rem .7rem; cursor:pointer; border-radius:999px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    text-shadow:0 0 10px rgba(255,255,255,.9), 0 1px 2px rgba(255,255,255,.8);
    transition:transform .25s ease, background .25s ease;}
  #enter-btn:hover{ transform:scale(1.04); background:rgba(255,255,255,.26);}
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none;}

  /* ---------- APP: single full-screen card ---------- */
  #app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity 1s ease .2s;}
  #app.show{ opacity:1;}
  #scroller{ position:absolute; inset:0; overflow-y:scroll; -webkit-overflow-scrolling:touch; scroll-snap-type:y mandatory; scroll-behavior:smooth;}
  .slide{ min-height:100vh; min-height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative;
    display:flex; align-items:center; justify-content:center;}

<script>
  // ---- particles ----
  const pWrap = document.getElementById('particles');
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (9+Math.random()*12)+'s';
    s.style.animationDelay = (Math.random()*12)+'s';
    pWrap.appendChild(s);
  }

  const video = document.getElementById('intro-video');
  video.load();

  const introEl = document.getElementById('intro');
  const appEl = document.getElementById('app');
  const enterBtn = document.getElementById('enter-btn');

  function enterSite(){
    introEl.classList.add('hidden');
    appEl.classList.add('show');
  }
  const bgm = document.getElementById('bg-music');
  bgm.loop = true;
  let started = false;
  function startWithSound(){
    if(started) return;
    started = true;
    document.getElementById('intro-overlay').style.display = 'none';
    bgm.play().catch(()=>{});          // silent unlock inside the tap (needed by phones)
    video.muted = !!musicUrl;          // custom music replaces the video's own sound
    video.currentTime = 0;
    video.play().catch(()=>{ enterSite(); });
    if(musicUrl) startMusic();
  }
  video.addEventListener('ended', enterSite);
  enterBtn.addEventListener('click', startWithSound);
  document.getElementById('skip-btn').addEventListener('click', ()=>{ startWithSound(); try{ video.pause(); }catch(_){} enterSite(); });
  setTimeout(()=>{ if(document.querySelector('div[style*="2147483000"]')) document.getElementById('skip-btn').style.top='calc(58px + env(safe-area-inset-top,0px))'; }, 400);

  // ---- Background music (chosen per invitation in Supabase) ----
  const SILENT = 'data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
  bgm.src = SILENT; bgm.dataset.src = 'silent';
  const musicBtn = document.getElementById('music-toggle');
  let musicUrl = null, musicPlaying = false;
  function updateBtn(){ musicBtn.textContent = musicPlaying ? '♫' : '♪'; musicBtn.style.opacity = musicPlaying ? '1' : '.75'; }
  let userPaused = false;
  function startMusic(){
    if(!musicUrl) return;
    if(bgm.dataset.src !== musicUrl){ bgm.src = musicUrl; bgm.dataset.src = musicUrl; }
    bgm.loop = true; bgm.muted = false; bgm.volume = 0.7;
    video.muted = true;
    bgm.play().then(()=>{ musicPlaying = true; userPaused = false; updateBtn(); })
      .catch(()=>{ musicPlaying = false; updateBtn(); });   // blocked by the browser: retried at the next tap
  }
  // if the browser blocked the music, retry at the guest's next tap
  ['pointerdown','touchend','click'].forEach(ev => document.addEventListener(ev, ()=>{
    if(musicUrl && started && !musicPlaying && !userPaused) startMusic();
  }, {passive:true}));
  window.onMusicReady = function(url){ musicUrl = url; musicBtn.style.display = 'flex'; if(started) startMusic(); };
  musicBtn.addEventListener('click', function(){
    if(!musicUrl) return;
    if(bgm.paused || bgm.dataset.src !== musicUrl){ startMusic(); }
    else { bgm.pause(); musicPlaying = false; userPaused = true; updateBtn(); }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(musicPlaying) bgm.pause(); }
    else if(musicPlaying){ bgm.play().catch(()=>{}); }
  });

  // ---- Supabase: load invitation infos ----
  const SUPABASE_URL = 'https://sgatagagyfizuyrinmth.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YdlXEbQn9ZqILsjT6pyAug_ijgzm5fQ';
  const slug = new URLSearchParams(location.search).get('i') || 'ornoir-demo';
  const PREVIEW = new URLSearchParams(location.search).get('preview');
  const LIVE = new URLSearchParams(location.search).get('live');
  function waitLive(){ return new Promise(function(res){
    window.addEventListener('message', async function h(e){
      if(e.origin !== location.origin || !e.data || e.data.type !== 'live') return;
      window.removeEventListener('message', h); const inv = e.data.inv;
      if(!(inv.music_tracks && inv.music_tracks.url)){ try{ const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_invitation', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug }) }); const j = await r.json(); if(j && j.music_tracks) inv.music_tracks = j.music_tracks; }catch(_){} }
      res(inv); });
    try{ parent.postMessage({ type:'live-ready' }, location.origin); }catch(_){}
  }); }
  if(PREVIEW){ const _g = document.createElement('script'); _g.src = '../preview-guard.js';
    _g.onerror = function(){ document.body.textContent = 'Aperçu indisponible pour le moment.'; }; document.head.appendChild(_g); }

  function row(icon, label, valueNode){
    const r = el('div','info-row'); { const ic = el('div','ic'); if(IC[icon]){ ic.innerHTML = IC[icon]; ic.classList.add('svg'); } else ic.textContent = icon; r.appendChild(ic); }
    const t = el('div','txt'); t.appendChild(el('div','k',label));
    const v = el('div','v'); v.appendChild(valueNode); t.appendChild(v); r.appendChild(t); return r;
  }
  function link(href, text){ const a=el('a',null,text); a.href=href; a.target='_blank'; a.rel='noopener'; return a; }


  function normName(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).sort().join(' '); }
  function buildRsvp(inv){
    const storeKey = 'rsvp_' + inv.id;
    let saved = null; try{ saved = JSON.parse(localStorage.getItem(storeKey) || 'null'); }catch(_){}
    const wrap = el('div','rsvp');
    wrap.appendChild(el('h3',null,'Confirmez votre présence'));
    const f = document.createElement('form');
    f.innerHTML = `
      <label for="r-name">Nom et prénom</label>
      <input type="text" id="r-name" maxlength="100" required autocomplete="name" placeholder="Prénom Nom">
      <label>Serez-vous présent(e) ?</label>

        <label><input type="radio" name="att" value="yes" checked><span>Oui, avec joie 💛</span></label>
        <label><input type="radio" name="att" value="no"><span>Non, désolé(e)</span></label>
      </div>
      <div id="r-count-wrap">
        <label for="r-count">Nombre de personnes</label>
        <input type="number" id="r-count" min="1" max="20" inputmode="numeric" required placeholder="Ex. 2">
      </div>
      <label for="r-all">Allergies / remarques (facultatif)</label>
      <input type="text" id="r-all" maxlength="300">
      <label for="r-msg">Petit mot (facultatif)</label>
      <textarea id="r-msg" maxlength="500"></textarea>
      <button type="submit">Envoyer ma réponse</button>
      <div class="note">Nous avons hâte de faire la fête avec vous 🥂</div>`;
    wrap.appendChild(f);
    if(saved){
      f.querySelector('#r-name').value = saved.name || '';
      f.querySelector(saved.attending ? 'input[value=yes]' : 'input[value=no]').checked = true;
      f.querySelector('#r-count').value = saved.attending ? saved.count : '';
      f.querySelector('#r-count-wrap').style.display = saved.attending ? '' : 'none';
      f.querySelector('#r-count').required = !!saved.attending;
      f.querySelector('#r-all').value = saved.allergies || '';
      f.querySelector('#r-msg').value = saved.message || '';
      f.querySelector('button[type=submit]').textContent = 'Mettre à jour ma réponse';
      wrap.querySelector('h3').textContent = 'Votre réponse';
      const info = el('div','dupe-info','Vous avez déjà répondu : vous pouvez la modifier ci-dessous.');
      wrap.insertBefore(info, f);
    }
    f.addEventListener('change', ()=>{
      const yes = f.att.value==='yes';
      f.querySelector('#r-count-wrap').style.display = yes ? '' : 'none';
      f.querySelector('#r-count').required = yes;
    });
    f.noValidate = true;   // we show our own friendly messages
    f.addEventListener('input', (ev)=>{ ev.target.classList.remove('invalid'); const n = ev.target.nextElementSibling; if(n && n.classList.contains('err')) n.remove(); });
    f.addEventListener('submit', async (e)=>{
      e.preventDefault();
      f.querySelectorAll('.err').forEach(x=>x.remove());
      const yes = f.att.value==='yes';
      const nameVal = f.querySelector('#r-name').value.trim().replace(/\s+/g,' ');
      const countVal = parseInt(f.querySelector('#r-count').value,10);
      function showError(field, msg){
        const m = el('div','err',msg);
        field.insertAdjacentElement('afterend', m);                     // right under that field
        field.classList.add('invalid');
        return m;
      }
      const problems = [];
      if(nameVal.split(' ').filter(Boolean).length < 2) problems.push(showError(f.querySelector('#r-name'), "Merci d'indiquer votre nom et votre prénom."));
      if(yes && !(countVal >= 1 && countVal <= 20)) problems.push(showError(f.querySelector('#r-count'), "Merci d'indiquer le nombre de personnes (entre 1 et 20)."));
      if(problems.length){
        const first = problems[0].previousElementSibling;
        first.focus({preventScroll:true});
        problems[0].scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      const btn = f.querySelector('button[type=submit]');
      const data = { name: nameVal, attending: yes, count: yes ? countVal : 0,
        allergies: f.querySelector('#r-all').value.trim() || null, message: f.querySelector('#r-msg').value.trim() || null };
      f.querySelectorAll('.dupe').forEach(x=>x.remove());

      async function call(mode, matchId){
        if(PREVIEW) return { status:'created', id:'apercu' };   // aperçu : aucune écriture
        const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_rsvp', { method:'POST',
          headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
          body: JSON.stringify({ p_invitation_id: inv.id, p_name: data.name, p_attending: data.attending, p_count: data.count,
            p_allergies: data.allergies, p_message: data.message, p_mode: mode, p_match_id: matchId || null }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const r = await res.json();
        if(r.status === 'error') throw new Error('refused: '+r.reason);
        return r;
      }
      function finish(updated, id){
        try{ localStorage.setItem(storeKey, JSON.stringify({ id, name: data.name, attending: data.attending, count: data.count, allergies: data.allergies, message: data.message })); }catch(_){}
        wrap.textContent='';
        const ok = el('div','confirm');
        ok.appendChild(el('div','confirm-emoji', yes ? '🎉' : '💌'));
        ok.appendChild(el('div','confirm-title', updated ? 'Réponse modifiée, merci !' : (yes ? "C'est noté, merci !" : 'Merci de nous avoir prévenus')));
        ok.appendChild(el('div','confirm-recap', data.name + ' — ' + (yes ? (data.count>1 ? 'présents ('+data.count+' personnes)' : 'présent(e)') : 'ne pourra pas venir')));
        if(yes && inv.event_date){
          const d = new Date(inv.event_date+'T12:00:00');
          let t = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
          ok.appendChild(el('div','confirm-when', 'Rendez-vous le ' + t + (inv.event_time ? ' à ' + inv.event_time : '')));
        }
        ok.appendChild(el('div','confirm-fun', yes ? 'Vivement la fête ! 🥂' : 'Vous allez nous manquer 💕'));
        const edit = el('button','confirm-edit','Modifier ma réponse'); edit.type = 'button';
        edit.addEventListener('click', ()=> wrap.replaceWith(buildRsvp(inv)));
        ok.appendChild(edit);
        wrap.appendChild(ok);
      }
      function failSend(){
        btn.disabled=false; btn.textContent = saved ? 'Mettre à jour ma réponse' : 'Envoyer ma réponse';
        f.insertBefore(el('div','err','Oups, l\'envoi a échoué. Réessayez dans un instant.'), btn);
      }
      function askModify(r){
        btn.disabled = false; btn.textContent = saved ? 'Mettre à jour ma réponse' : 'Envoyer ma réponse'; btn.style.display = 'none';
        const box = el('div','dupe');
        box.appendChild(el('div','dupe-title','Vous avez déjà répondu 🙂'));
        box.appendChild(el('div','dupe-text', 'Une réponse existe déjà au nom de « ' + r.match_name + ' ». Voulez-vous la modifier ? Ce que vous venez de saisir remplacera votre réponse précédente.'));
        const yesBtn = el('button','dupe-yes','Oui, modifier ma réponse'); yesBtn.type='button';
        const noBtn = el('button','dupe-no',"Non, c'est une autre personne"); noBtn.type='button';
        const lock = (t)=>{ yesBtn.disabled = noBtn.disabled = true; t.textContent = 'Envoi…'; };
        yesBtn.addEventListener('click', async ()=>{ lock(yesBtn); try{ const x = await call('update', r.match_id); finish(true, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        noBtn.addEventListener('click', async ()=>{ lock(noBtn); try{ const x = await call('new'); finish(false, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        box.appendChild(yesBtn); box.appendChild(noBtn);
        f.insertBefore(box, btn);
        box.scrollIntoView({behavior:'smooth', block:'center'});
      }

      btn.disabled = true; btn.textContent = 'Envoi…';
      try{
        let r;
        // this device already answered with the same name -> modify directly, no question asked
        if(saved && saved.id && normName(saved.name) === normName(data.name)) r = await call('update', saved.id);
        else r = await call('check');
        if(r.status === 'exists'){ askModify(r); return; }
        finish(r.status === 'updated', r.id);
      }catch(err){ failSend(); }
    });
    return wrap;
  }


  // ---- Navigation buttons: open the user's own navigation app ----
  function buildNavLinks(inv, label){
    const box = el('div','nav-links');
    const q = encodeURIComponent(inv.address || label);
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    const isAndroid = /Android/.test(ua);
    function add(text, href){ const a = el('a', null, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); }
    if(!inv.address && inv.maps_url){ add('Itinéraire', inv.maps_url); return box; }
    add('Google Maps', 'https://www.google.com/maps/dir/?api=1&destination=' + q);
    add('Waze', 'https://waze.com/ul?q=' + q + '&navigate=yes');
    if(isIOS) add('Plans', 'https://maps.apple.com/?daddr=' + q);
    if(isAndroid) add('Autre appli', 'geo:0,0?q=' + q);
    return box;
  }


  // ---- Carte : textes lus dans Supabase (card_text) ou déduits des infos de l'invitation ----
  const CARD_DEFAULTS = { slogan:'Une occasion en or\nde faire la fête.' };
  function deriveCard(inv){
    const t = Object.assign({}, inv.card_text || {});
    const out = {};
    let age = t.age;
    if(age == null){ const m = String(inv.title||'').match(/(\d{1,3})\s*ans/i); age = m ? m[1] : ''; }
    age = String(age||'').trim();
    if(/^\d{1,3}$/.test(age)) age += ' Ans';
    out.age = age;
    out.slogan = t.slogan != null ? t.slogan : CARD_DEFAULTS.slogan;
    return out;
  }
  const $c = id => document.getElementById(id);
  function fitWidth(box, inner, startCqw, minCqw){
    let s = startCqw; box.style.fontSize = s + 'cqw';
    while(s > minCqw && inner.getBoundingClientRect().width > box.clientWidth - 1){ s -= 0.2; box.style.fontSize = s.toFixed(2) + 'cqw'; }
    return s;
  }
  function fitBox(box, inner, startCqw, minCqw){
    let s = startCqw; box.style.fontSize = s + 'cqw';
    while(s > minCqw && (inner.getBoundingClientRect().height > box.clientHeight + 1 || inner.scrollWidth > box.clientWidth + 1)){ s -= 0.15; box.style.fontSize = s.toFixed(2) + 'cqw'; }
  }
  function renderCard(inv){
    const c = deriveCard(inv);
    const ag = $c('c-age'); ag.style.display = c.age ? '' : 'none';
    if(c.age){
      const m = c.age.match(/^\s*(\d{1,3})\s*(.*)$/);
      const num = ag.querySelector('.num'), unit = ag.querySelector('.unit');
      num.textContent = m ? m[1] : c.age; unit.textContent = m ? (m[2] || 'Ans') : ''; unit.style.display = unit.textContent ? '' : 'none';
      let fs = 12, k = 2.9; ag.style.fontSize = fs + 'cqw'; num.style.fontSize = k + 'em';
      const over = () => num.getBoundingClientRect().width > ag.clientWidth - 1 || unit.getBoundingClientRect().width > ag.clientWidth - 1 || (num.getBoundingClientRect().height + (unit.style.display === 'none' ? 0 : unit.getBoundingClientRect().height)) > ag.clientHeight + 1;
      while(k > 1.2 && over()){ k -= 0.05; num.style.fontSize = k.toFixed(2) + 'em'; }
      while(fs > 6 && over()){ fs -= 0.2; ag.style.fontSize = fs.toFixed(2) + 'cqw'; }
    }
    const sl = $c('c-slogan'); sl.style.display = c.slogan ? '' : 'none';
    if(c.slogan){ sl.firstChild.textContent = c.slogan; fitBox(sl, sl.firstChild, 4.7, 2.2); }
    document.querySelectorAll('#card .zone').forEach(z=>z.classList.add('ready'));
    if(document.fonts && document.fonts.load && !renderCard._f){ renderCard._f = 1; Promise.all([document.fonts.load('100px Allura'), document.fonts.load('600 40px "Playfair Display"')]).then(()=>{ if(_lastInv) renderCard(_lastInv); }).catch(()=>{}); }
  }
  let _lastInv = null;
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ if(_lastInv) renderCard(_lastInv); });
  let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{ if(_lastInv) renderCard(_lastInv); }, 150); });


  // ---- Compte à rebours jusqu'à l'événement ----
  function buildCountdown(inv){
    if(!inv.event_date) return document.createDocumentFragment();
    const [y,m,d] = inv.event_date.split('-').map(Number);
    let h = 0, mi = 0; const t = String(inv.event_time||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})?/); if(t){ h = +t[1]; mi = +(t[2]||0); }
    const target = new Date(y, m-1, d, h, mi, 0);
    const wrap = el('div','cd'), title = el('div','cd-title'), grid = el('div','cd-grid');
    const cells = ['jours','heures','minutes','secondes'].map(l=>{ const c = el('div','cd-cell'); const n = el('b','cd-n','00'); c.appendChild(n); c.appendChild(el('span','cd-l',l)); grid.appendChild(c); return n; });
    wrap.appendChild(title); wrap.appendChild(grid);
    let timer = null;
    function tick(){
      let s = Math.floor((target - new Date())/1000);
      if(s <= 0){
        const now = new Date();
        title.textContent = (now.getFullYear()===y && now.getMonth()===m-1 && now.getDate()===d) ? "C'est aujourd'hui !" : "L'événement a eu lieu ✨";
        grid.style.display = 'none'; if(timer) clearInterval(timer); return;
      }
      title.textContent = 'Rendez-vous dans'; grid.style.display = '';
      const dd = Math.floor(s/86400); s %= 86400; const hh = Math.floor(s/3600); s %= 3600; const mm = Math.floor(s/60), ss = s % 60;
      [dd,hh,mm,ss].forEach((v,i)=>{ cells[i].textContent = String(v).padStart(i===0 && dd>99 ? 3 : 2, '0'); });
    }
    timer = setInterval(tick, 1000); tick();
    return wrap;
  }

  async function loadInfos(){
    const box = document.getElementById('info-card');
    try{
      let data;
      if(LIVE){ const one = await waitLive(); data = one ? [one] : []; }
      else if(PREVIEW){
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_preview', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_code: PREVIEW }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const one = await res.json(); data = one ? [one] : [];
      } else {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_invitation', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const one = await res.json(); data = one ? [one] : [];
      }
      if(!data.length && slug === 'ornoir-demo' && !PREVIEW && !LIVE){   // démo intégrée tant que la fiche n'est pas en base
        data = [{ id:'demo-ornoir', slug:'ornoir-demo', title:'Les 30 ans de Léa', host_names:'Léa', event_date:'2027-03-20', event_time:'20h00', venue_name:'Le Grand Salon', address:'Le Grand Salon, Paris', maps_url:'https://www.google.com/maps',
          message:'Venez fêter ça avec nous !', dress_code:'Tenue chic, touche de doré', contact_name:'Julie', contact_phone:'06 12 34 56 78', rsvp_enabled:true, invitation_programme:[],
          card_text:{ age:'30', slogan:'Une occasion en or\nde faire la fête.' }, music_tracks:{ url:'musique-ornoir.mp3', title:'Or & Noir' } }];
      }
      box.textContent = '';
      if(!data.length){ box.appendChild(el('div','status','Invitation introuvable.')); return; }
      const inv = data[0];
      _lastInv = inv; renderCard(inv);
      if(inv.music_tracks && inv.music_tracks.url) window.onMusicReady(inv.music_tracks.url);

      box.appendChild(el('h2', null, inv.title));
      if(inv.host_names) box.appendChild(el('div','host', inv.host_names));
      box.appendChild(buildCountdown(inv));

      const rows = el('div','info-rows');
      if(inv.event_date){
        const d = new Date(inv.event_date+'T12:00:00');
        let txt = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        txt = txt.charAt(0).toUpperCase()+txt.slice(1);
        rows.appendChild(row('📅','Date', document.createTextNode(txt)));
      }
      if(inv.event_time) rows.appendChild(row('🕒','Heure', document.createTextNode(inv.event_time)));
      if(inv.venue_name || inv.address){
        const wrap = document.createElement('span');
        const vn = (inv.venue_name||'').trim(), ad = (inv.address||'').trim(); const label = (vn && ad && ad.toLowerCase().indexOf(vn.toLowerCase()) === 0) ? ad : [vn, ad].filter(Boolean).join(' — ');
        wrap.appendChild(document.createTextNode(label));
        wrap.appendChild(buildNavLinks(inv, label));
        rows.appendChild(row('📍','Lieu', wrap));
      }
      if(inv.contact_name || inv.contact_phone){
        const wrap = document.createElement('span');
        if(inv.contact_name) wrap.appendChild(document.createTextNode(inv.contact_name + (inv.contact_phone?' — ':'')));
        if(inv.contact_phone) wrap.appendChild(link('tel:'+inv.contact_phone.replace(/\s/g,''), inv.contact_phone));
        rows.appendChild(row('📞','Contact', wrap));
      }
      if(inv.dress_code) rows.appendChild(row('👗','Dress code', document.createTextNode(inv.dress_code)));
      if(rows.children.length) box.appendChild(rows);
      if(inv.message) box.appendChild(el('p','info-message', inv.message));

      if(inv.rsvp_enabled) box.appendChild(buildRsvp(inv));

      const prog = (inv.invitation_programme||[]).sort((a,b)=>a.position-b.position);
      if(prog.length){
        const p = el('div','prog'); p.appendChild(el('h3',null,'Programme'));
        prog.forEach(s=>{
          const it = el('div','prog-item'); it.appendChild(el('div','t', s.time||''));
          const w = el('div'); w.appendChild(el('div','n', s.title));
          if(s.description) w.appendChild(el('div','d', s.description));
          it.appendChild(w); p.appendChild(it);
        });
        box.appendChild(p);
      }
    }catch(e){
      box.textContent=''; box.appendChild(el('div','status','Impossible de charger les informations pour le moment.'));
    }
  }
  loadInfos();
</script>
