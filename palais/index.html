  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --rose:#F6C6D0;
    --rose-vif:#E2B77A;
    --lavande:#C9B6E4;
    --menthe:#A8E0D4;
    --jaune:#F7DE8C;
    --ink-onphoto:#FFF9F2;
    --encre:#4A1F2A;
    --body: 'Jost', system-ui, sans-serif;
  }
  body{ font-family:var(--body); color:var(--encre); background:#1d120c; height:100vh; height:100dvh; overflow:hidden;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

  #backdrop{ position:fixed; inset:0; z-index:0; background-image:var(--bg-img); background-size:cover; background-position:center;}
  #backdrop::after{ content:''; position:absolute; inset:0;
    background: radial-gradient(ellipse at 50% 0%, rgba(60,40,20,0.08), rgba(40,25,15,0.30) 75%), linear-gradient(180deg, rgba(50,30,15,0.18), rgba(35,20,10,0.30));}

  #particles{ position:fixed; inset:0; z-index:1; pointer-events:none;}
  .spark{ position:absolute; top:-14px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, var(--rose-vif) 70%);
    box-shadow:0 0 6px 1px rgba(247,156,180,0.5); animation:fall linear infinite; opacity:0;}
  @keyframes fall{ 0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;} 8%{opacity:.9;} 50%{transform:translateY(55vh) translateX(-20px) rotate(120deg);} 92%{opacity:.55;} 100%{transform:translateY(112vh) translateX(16px) rotate(240deg); opacity:0;} }

  /* ---------- INTRO ---------- */
  #intro{ position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center;
    transition:opacity 1.3s ease, visibility 1.3s ease;}
  #intro video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.96;}
  #intro-overlay{ position:absolute; left:0; right:0; bottom:calc(9% + env(safe-area-inset-bottom,0px)); z-index:2; text-align:center; padding:0 1.2rem;}
  #enter-btn, #skip-btn{ font-family:'PacificoLocal','Pacifico', cursive; font-weight:400; font-size:1.35rem;
    color:#D9A94A; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.6);
    padding:.55rem 2rem .7rem; cursor:pointer; border-radius:999px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    text-shadow:0 0 10px rgba(255,255,255,.9), 0 1px 2px rgba(255,255,255,.8);
    transition:transform .25s ease, background .25s ease;}
  #enter-btn:hover{ transform:scale(1.04); background:rgba(255,255,255,.26);}
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none;}

  /* ---------- APP: single full-screen card ---------- */
  #app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity 1s ease .2s;}
  #app.show{ opacity:1;}
  #scroller{ position:absolute; inset:0; overflow-y:scroll; -webkit-overflow-scrolling:touch; scroll-snap-type:y mandatory; scroll-behavior:smooth;}
  .slide{ min-height:100vh; min-height:100dvh; width:100%; scroll-snap-align:start; scroll-snap-stop:always; position:relative;
    display:flex; align-items:center; justify-content:center;}
  .card-slide{ padding:2vh 2vw;}
  .cover-img{ display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;
    border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.35);}
  .scroll-hint{ position:absolute; bottom:1rem; left:0; right:0; text-align:center; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.5); pointer-events:none;}
  .scroll-hint span{ display:block; font-family:var(--body); font-weight:600; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;}
  .chevron{ font-size:1.5rem; line-height:1; animation:bounce 1.8s ease-in-out infinite;}
  @keyframes bounce{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(7px);} }

  .info-slide{ padding:4rem 1.1rem 2.5rem;}
  .info-card{ width:100%; max-width:560px; background:rgba(255,249,242,.55); border:1.5px solid rgba(255,255,255,.75);
    border-radius:28px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 18px 50px rgba(120,80,40,.25); padding:2rem 1.5rem; text-align:center; color:#4A1F2A;}
  .info-card h2{ font-family:var(--body); font-weight:800; font-size:1.7rem; line-height:1.2; color:#A8761F; margin-bottom:.3rem;}
  .info-card .host{ font-weight:600; color:#7A5A4A; margin-bottom:1rem;}
  .info-rows{ display:flex; flex-direction:column; gap:.7rem; margin-top:1.2rem; text-align:left;}
  .info-row{ display:flex; align-items:center; gap:.9rem; background:rgba(255,255,255,.55); border-radius:18px; padding:.8rem 1rem;}
  .info-row .ic{ font-size:1.4rem; flex:0 0 auto;}
  .info-row .ic.svg{ width:46px; height:46px; box-sizing:border-box; padding:11px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#B8862B; background:radial-gradient(circle at 35% 30%,#fffaf0,#f6e6c4); border:1px solid #C9922E; box-shadow:inset 0 0 0 3px rgba(255,255,255,.92), inset 0 0 0 4px rgba(201,146,46,.35), 0 3px 10px rgba(150,100,20,.18); } .info-row .ic.svg svg{ width:100%; height:100%; display:block; }
  .info-row .k{ font-size:.68rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#9A7335;}
  .info-row .v{ font-weight:600; font-size:1.05rem; color:#4A1F2A; word-break:break-word;}
  .info-row a{ color:inherit; text-decoration:underline; text-decoration-color:#D9A94A;}
  .info-row .nav-links{ display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem;}
  .info-row .nav-links a{ font-size:.78rem; font-weight:700; text-decoration:none; color:#fff; background:#A8761F; border-radius:999px; padding:.3rem .85rem;}
  .info-message{ margin-top:1.2rem; font-weight:500; line-height:1.5; color:#4A1F2A;}
  .prog{ margin-top:1.4rem; text-align:left;}
  .prog h3{ font-weight:800; font-size:1rem; color:#A8761F; text-align:center; margin-bottom:.6rem;}
  .prog-item{ display:flex; gap:.8rem; padding:.45rem 0; border-top:1px dashed rgba(168,118,31,.3);}
  .prog-item .t{ font-weight:800; color:#9A7335; min-width:3.4rem;}
  .prog-item .n{ font-weight:600;} .prog-item .d{ font-size:.9rem; opacity:.8;}

  .rsvp{ margin-top:1.6rem; padding-top:1.3rem; border-top:1.5px dashed rgba(168,118,31,.35); text-align:left;}
  .rsvp h3{ font-weight:800; font-size:1.15rem; color:#A8761F; text-align:center; margin-bottom:.8rem;}
  .rsvp label{ display:block; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:#7C4A2A; margin:.8rem 0 .3rem;}
  .rsvp input[type=text], .rsvp input[type=number], .rsvp textarea{ width:100%; font-family:var(--body); font-size:1rem; font-weight:500; color:#4A1F2A;
    background:rgba(255,255,255,.7); border:1.5px solid rgba(168,118,31,.3); border-radius:14px; padding:.65rem .9rem; outline:none;}
  .rsvp input:focus, .rsvp textarea:focus{ border-color:#A8761F;}
  .rsvp textarea{ resize:vertical; min-height:70px;}
  .choice{ display:flex; gap:.6rem;}
  .choice label{ flex:1; margin:0; text-transform:none; letter-spacing:0; font-size:.95rem; color:#4A1F2A; background:rgba(255,255,255,.7);
    border:1.5px solid rgba(168,118,31,.3); border-radius:14px; padding:.7rem .5rem; text-align:center; cursor:pointer;}
  .choice input{ display:none;}
  .choice input:checked + span{ font-weight:800; color:#A8761F;}
  .choice label:has(input:checked){ border-color:#A8761F; background:#fff;}
  .rsvp button{ width:100%; margin-top:1.2rem; font-family:var(--body); font-weight:800; font-size:1.05rem; color:#fff; border:none; cursor:pointer;
    background:linear-gradient(135deg,#D9A94A,#A8761F); border-radius:999px; padding:.8rem 1rem; box-shadow:0 8px 22px rgba(168,118,31,.35);}
  .rsvp button:disabled{ opacity:.6; cursor:default;}
  .rsvp .note{ font-size:.95rem; font-weight:700; color:#A8761F; margin-top:.9rem; text-align:center; line-height:1.4;}
  .confirm{ text-align:center; padding:.6rem 0 .2rem;}
  .confirm-emoji{ font-size:2.4rem; margin-bottom:.2rem;}
  .confirm-title{ font-weight:800; font-size:1.3rem; color:#A8761F;}
  .confirm-recap{ margin-top:.6rem; font-weight:600; background:rgba(255,255,255,.7); border-radius:14px; padding:.6rem .8rem;}
  .confirm-when{ margin-top:.6rem; font-weight:600; color:#4A1F2A;}
  .confirm-fun{ margin-top:.8rem; font-weight:800; color:#A8761F;}
  .dupe{ background:#FFF6D9; border:1.5px solid #F2C94C; border-radius:16px; padding:.9rem; margin-top:1rem; text-align:center;}
  .dupe-title{ font-weight:800; color:#8A5A00; font-size:1.05rem;}
  .dupe-text{ margin:.4rem 0 .8rem; font-weight:600; font-size:.92rem; line-height:1.4; color:#5A4300;}
  .dupe button{ display:block; width:100%; margin-top:.5rem; font-family:var(--body); font-weight:800; font-size:.98rem; border-radius:999px; padding:.7rem 1rem; cursor:pointer;}
  .dupe .dupe-yes{ color:#fff; background:linear-gradient(135deg,#D9A94A,#A8761F); border:none; box-shadow:0 6px 16px rgba(168,118,31,.3);}
  .dupe .dupe-no{ color:#A8761F; background:#fff; border:1.5px solid #A8761F; box-shadow:none;}
  .dupe button:disabled{ opacity:.6;}
  .dupe-info{ text-align:center; font-weight:700; font-size:.9rem; color:#7A5A4A; background:rgba(255,255,255,.6); border-radius:12px; padding:.5rem .7rem; margin-bottom:.4rem;}
  .confirm-edit{ margin-top:1rem; background:none; border:none; color:#7C4A2A; font-family:var(--body); font-weight:700; font-size:.92rem; text-decoration:underline; cursor:pointer; width:auto; box-shadow:none; padding:.3rem;}
  .rsvp .done{ text-align:center; font-weight:700; color:#A8761F; padding:1rem 0;}
  .rsvp .err{ font-weight:700; font-size:.85rem; color:#B3261E; background:#FDECEF; border-radius:10px;
    padding:.35rem .7rem; margin-top:.4rem; text-align:left;}
  .rsvp input.invalid{ border-color:#D32F4F; box-shadow:0 0 0 3px rgba(211,47,79,.18);}
  .status{ color:#7A5A4A; font-weight:600; padding:1rem 0;}

  #music-toggle{ position:fixed; top:1.1rem; right:1.1rem; z-index:20; width:42px; height:42px; border-radius:50%;
    border:2px solid var(--rose-vif); background:rgba(50,30,15,.5); color:#fff; cursor:pointer; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;}


  /* ---------- THEME BOHÈME (or, crème, rose poudré) ---------- */
  :root{ --or:#B8862B; --or-clair:#E3BE6B; --bordeaux:#4A1F2A; --creme:#FBF3E4; --rose-poudre:#E7B3A5; }
  body{ font-family:'Jost',system-ui,sans-serif; }
  #backdrop::after{ background:radial-gradient(ellipse at 50% 0%, rgba(255,235,200,.10), rgba(60,35,15,.30) 78%); }
  .spark{ width:9px; height:12px; border-radius:60% 0 60% 40%; background:linear-gradient(135deg,#fff3e6,#E7B3A5); box-shadow:0 0 6px 1px rgba(231,179,165,.5); }
  .spark:nth-child(3n){ background:linear-gradient(135deg,#fff6d8,#E3BE6B); box-shadow:0 0 6px 1px rgba(227,190,107,.55); }
  #enter-btn, #skip-btn{ font-family:'Great Vibes',cursive; font-size:2rem; line-height:1.1; padding:.45rem 2.1rem .6rem; border:2px solid transparent; border-radius:999px;
    background:linear-gradient(rgba(255,248,235,.72),rgba(255,248,235,.72)) padding-box, linear-gradient(100deg,#E3BE6B,#B8862B,#E3BE6B) border-box;
    box-shadow:0 8px 26px rgba(80,50,10,.35); text-shadow:none; color:transparent;}
  #enter-btn:hover{ background:linear-gradient(rgba(255,250,240,.88),rgba(255,250,240,.88)) padding-box, linear-gradient(100deg,#E3BE6B,#B8862B,#E3BE6B) border-box;}
  #enter-btn span, #skip-btn span{ background:linear-gradient(100deg,#8C5A12,#C9922E 50%,#8C5A12); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; padding:0 .1em;}
  #music-toggle{ border-color:var(--or-clair); }

  /* carte HTML */
  .card-slide{ flex-direction:column; padding:2vh 3vw 0; }
  .card{ position:relative; container-type:inline-size; width:min(94vw, calc((100dvh - 11dvh) * .75)); aspect-ratio:1086/1448; border-radius:14px; overflow:hidden;
    box-shadow:0 14px 44px rgba(40,20,0,.40); background:#FBF1DE; margin-top:-2vh;}
  .card > img{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .zone{ position:absolute; display:flex; align-items:center; justify-content:center; text-align:center; opacity:0; transition:opacity .5s ease;}
  .zone.ready{ opacity:1; }
  .zone > span{ display:inline-block; white-space:nowrap; }
  .gold{ background:linear-gradient(100deg,#8C5A12 0%,#C9922E 32%,#E8C56B 50%,#B8862B 70%,#8C5A12 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; padding:.06em .14em; }
  #c-mono{ left:38.6%; width:23.6%; top:18%; height:15.4%; }
  #c-mono svg{ display:block; width:100%; height:100%; overflow:visible; }
  #c-names .gold{ background-image:linear-gradient(100deg,#7C4D0E 0%,#B27C20 35%,#D2A24A 52%,#A8701A 72%,#7C4D0E 100%); }
  #c-names > span.pair{ display:grid; grid-template-columns:1fr auto 1fr; align-items:baseline; width:100%; }
  #c-names .pair .n1{ justify-self:end; white-space:nowrap; } #c-names .pair .n2{ justify-self:start; white-space:nowrap; } #c-names .pair .amp{ padding:0 .22em; white-space:nowrap; }
  #c-names > span.gold{ padding:.3em .08em .5em; -webkit-text-stroke:.35px #A8701A; }
  #c-names{ left:10%; width:80%; top:37.2%; height:13.8%; font-family:'Ephesis',cursive; line-height:1; }
  #c-intro{ left:21%; width:58%; top:54%; height:7.2%; font-family:'Cormorant Garamond',serif; font-weight:500; letter-spacing:.04em; line-height:1.3; color:#2E2622; }
  #c-intro > span{ white-space:normal; text-wrap:balance; display:block; width:100%; }
  #c-rows{ position:absolute; left:13.8%; top:67.2%; width:71.8%; height:10.8%; display:grid; grid-template-columns:35.5% 32% 32.5%; opacity:0; transition:opacity .5s ease;}
  #c-rows.ready{ opacity:1; }
  .crow{ position:relative; display:flex; flex-direction:column; align-items:center; min-height:0; padding:0 1.2cqw; }
  .crow + .crow::before{ content:''; position:absolute; left:0; top:2%; bottom:0; width:1.5px; background:linear-gradient(180deg,rgba(184,134,43,.15),#B8862B 20%,#B8862B 80%,rgba(184,134,43,.15)); }
  .crow .ico{ flex:0 0 5.8cqw; width:5.8cqw; height:5.8cqw; color:var(--or); display:flex; align-items:center; justify-content:center; margin:0 0 1.2cqw; }
  .crow .ico svg{ width:100%; height:100%; display:block; }
  .crow .txt{ font-variant-numeric:lining-nums; font-feature-settings:'lnum' 1; flex:1; min-width:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; font-family:'Cormorant Garamond',serif; font-weight:600; color:#1F1A17; line-height:1.18; }
  .crow .txt > span{ display:block; width:100%; white-space:pre-line; text-wrap:balance; }
  .crow .txt > span + span{ margin-top:.1em; }
  #c-close{ display:none; }
  .scroll-hint{ color:#FFF6E6; }

  /* infos + RSVP */
  .info-slide{ background:var(--bg-img) center/cover no-repeat; }
  .info-slide::before{ content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,243,225,.22),rgba(255,236,210,.42)); }
  .info-card{ position:relative; background:rgba(255,250,241,.86); border:1.5px solid rgba(201,146,46,.55); outline:1px solid rgba(201,146,46,.28); outline-offset:-9px;
    border-radius:26px; box-shadow:0 18px 50px rgba(80,50,10,.30); color:var(--bordeaux); padding:2.3rem 1.5rem; }
  .info-card h2{ font-family:'Great Vibes',cursive; font-weight:400; font-size:2.7rem; line-height:1.15; padding:.05em .1em;
    background:linear-gradient(100deg,#8C5A12,#C9922E 40%,#B8862B 70%,#8C5A12); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .info-card .host{ font-family:'Cormorant Garamond',serif; font-style:normal; font-weight:600; font-size:1.2rem; letter-spacing:.04em; color:#7A5A4A; }
  .info-row{ background:rgba(255,255,255,.62); border:1px solid rgba(201,146,46,.25); }
  .info-row .k{ color:var(--or) !important; font-family:'Jost',sans-serif; }
  .info-row .v{ font-variant-numeric:lining-nums; font-feature-settings:'lnum' 1; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:1.18rem; color:var(--bordeaux); }
  .info-row .nav-links a{ background:linear-gradient(135deg,#D9A94A,#A8761F); font-family:'Jost',sans-serif; }
  .info-row a{ text-decoration-color:#D9A94A; }
  .info-message{ font-family:'Cormorant Garamond',serif; font-size:1.15rem; font-weight:500; }
  .prog h3,.rsvp h3,.confirm-title,.confirm-fun,.rsvp .note,.rsvp .done{ font-family:'Cormorant Garamond',serif; color:#A8761F; }
  .prog h3,.rsvp h3{ font-size:1.5rem; font-weight:700; }
  .prog-item .t{ color:var(--or); }
  .rsvp{ border-top:1.5px dashed rgba(184,134,43,.45); }
  .rsvp label{ color:#7C4A2A; }
  .rsvp button, .dupe .dupe-yes{ background:linear-gradient(135deg,#E3BE6B,#B8862B); box-shadow:0 8px 22px rgba(168,118,31,.35); font-family:'Jost',sans-serif; letter-spacing:.03em; }
  .dupe .dupe-no{ color:#A8761F; border-color:#A8761F; }
  .choice label:has(input:checked){ border-color:#B8862B; } .choice input:checked + span{ color:#A8761F; }
  .rsvp input:focus,.rsvp textarea:focus{ border-color:#B8862B; }
  .rsvp input[type=text], .rsvp input[type=number], .rsvp textarea{ border-color:rgba(184,134,43,.35); }

  .cd{ margin:1.2rem 0 .3rem; }
  .cd-title{ font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:1.2rem; color:#7A5A4A; margin-bottom:.6rem; }
  .cd-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; }
  .cd-cell{ background:rgba(255,255,255,.72); border:1px solid rgba(201,146,46,.5); border-radius:16px; padding:.65rem .15rem .55rem; box-shadow:inset 0 0 0 3px rgba(255,248,232,.8), 0 4px 12px rgba(120,80,20,.10); }
  .cd-n{ display:block; font-family:'Cormorant Garamond',serif; font-weight:700; font-size:2.1rem; line-height:1.05; font-variant-numeric:lining-nums tabular-nums; font-feature-settings:'lnum' 1;
    background:linear-gradient(160deg,#8C5A12,#D4A13A 55%,#8C5A12); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; }
  .cd-l{ display:block; font-family:'Jost',sans-serif; font-size:.58rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#B8862B; margin-top:.2rem; }
  #skip-btn{ position:absolute; z-index:5; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; bottom:auto; left:auto; transform:none;
    font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:600; letter-spacing:.04em; font-size:.95rem; line-height:1.2; padding:.2rem 1.15rem .34rem; border-width:1.5px; opacity:.9;}
  #skip-btn:hover{ transform:none; }
</style>

<script>
  // ---- particles ----
  const pWrap = document.getElementById('particles');
  for(let i=0;i<22;i++){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = Math.random()*100+'vw';
    s.style.animationDuration = (9+Math.random()*12)+'s';
    s.style.animationDelay = (Math.random()*12)+'s';
    pWrap.appendChild(s);
  }

  const video = document.getElementById('intro-video');
  video.load();

  const introEl = document.getElementById('intro');
  const appEl = document.getElementById('app');
  const enterBtn = document.getElementById('enter-btn');

  function enterSite(){
    introEl.classList.add('hidden');
    appEl.classList.add('show');
  }
  const bgm = document.getElementById('bg-music');
  bgm.loop = true;
  let started = false;
  function startWithSound(){
    if(started) return;
    started = true;
    document.getElementById('intro-overlay').style.display = 'none';
    bgm.play().catch(()=>{});          // silent unlock inside the tap (needed by phones)
    video.muted = !!musicUrl;          // custom music replaces the video's own sound
    video.currentTime = 0;
    video.play().catch(()=>{ enterSite(); });
    if(musicUrl) startMusic();
  }
  video.addEventListener('ended', enterSite);
  enterBtn.addEventListener('click', startWithSound);
  document.getElementById('skip-btn').addEventListener('click', ()=>{ startWithSound(); try{ video.pause(); }catch(_){} enterSite(); });
  setTimeout(()=>{ if(document.querySelector('div[style*="2147483000"]')) document.getElementById('skip-btn').style.top='calc(58px + env(safe-area-inset-top,0px))'; }, 400);

  // ---- Background music (chosen per invitation in Supabase) ----
  const SILENT = 'data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
  bgm.src = SILENT; bgm.dataset.src = 'silent';
  const musicBtn = document.getElementById('music-toggle');
  let musicUrl = null, musicPlaying = false;
  function updateBtn(){ musicBtn.textContent = musicPlaying ? '♫' : '♪'; musicBtn.style.opacity = musicPlaying ? '1' : '.75'; }
  let userPaused = false;
  function startMusic(){
    if(!musicUrl) return;
    if(bgm.dataset.src !== musicUrl){ bgm.src = musicUrl; bgm.dataset.src = musicUrl; }
    bgm.loop = true; bgm.muted = false; bgm.volume = 0.7;
    video.muted = true;
    bgm.play().then(()=>{ musicPlaying = true; userPaused = false; updateBtn(); })
      .catch(()=>{ musicPlaying = false; updateBtn(); });   // blocked by the browser: retried at the next tap
  }
  // if the browser blocked the music, retry at the guest's next tap
  ['pointerdown','touchend','click'].forEach(ev => document.addEventListener(ev, ()=>{
    if(musicUrl && started && !musicPlaying && !userPaused) startMusic();
  }, {passive:true}));
  window.onMusicReady = function(url){ musicUrl = url; musicBtn.style.display = 'flex'; if(started) startMusic(); };
  musicBtn.addEventListener('click', function(){
    if(!musicUrl) return;
    if(bgm.paused || bgm.dataset.src !== musicUrl){ startMusic(); }
    else { bgm.pause(); musicPlaying = false; userPaused = true; updateBtn(); }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(musicPlaying) bgm.pause(); }
    else if(musicPlaying){ bgm.play().catch(()=>{}); }
  });

  // ---- Supabase: load invitation infos ----
  const SUPABASE_URL = 'https://sgatagagyfizuyrinmth.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YdlXEbQn9ZqILsjT6pyAug_ijgzm5fQ';
  const slug = new URLSearchParams(location.search).get('i') || 'palais-demo';
  const PREVIEW = new URLSearchParams(location.search).get('preview');
  const LIVE = new URLSearchParams(location.search).get('live');
  function waitLive(){ return new Promise(function(res){
    window.addEventListener('message', async function h(e){
      if(e.origin !== location.origin || !e.data || e.data.type !== 'live') return;
      window.removeEventListener('message', h); const inv = e.data.inv;
      if(!(inv.music_tracks && inv.music_tracks.url)){ try{ const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_invitation', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug }) }); const j = await r.json(); if(j && j.music_tracks) inv.music_tracks = j.music_tracks; }catch(_){} }
      res(inv); });
    try{ parent.postMessage({ type:'live-ready' }, location.origin); }catch(_){}
  }); }
  if(PREVIEW){ const _g = document.createElement('script'); _g.src = '../preview-guard.js';
    _g.onerror = function(){ document.body.textContent = 'Aperçu indisponible pour le moment.'; }; document.head.appendChild(_g); }

  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  function normName(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).sort().join(' '); }
  function buildRsvp(inv){
    const storeKey = 'rsvp_' + inv.id;
    let saved = null; try{ saved = JSON.parse(localStorage.getItem(storeKey) || 'null'); }catch(_){}
    const wrap = el('div','rsvp');
    wrap.appendChild(el('h3',null,'Confirmez votre présence'));
    const f = document.createElement('form');
    f.innerHTML = `
      <label for="r-name">Nom et prénom</label>
      <input type="text" id="r-name" maxlength="100" required autocomplete="name" placeholder="Prénom Nom">
      <label>Serez-vous présent(e) ?</label>
      <div class="choice">
        <label><input type="radio" name="att" value="yes" checked><span>Oui, avec joie 💛</span></label>
        <label><input type="radio" name="att" value="no"><span>Non, désolé(e)</span></label>
      </div>
      <div id="r-count-wrap">
        <label for="r-count">Nombre de personnes</label>
        <input type="number" id="r-count" min="1" max="20" inputmode="numeric" required placeholder="Ex. 2">
      </div>
      <label for="r-all">Allergies / remarques (facultatif)</label>
      <input type="text" id="r-all" maxlength="300">
      <label for="r-msg">Petit mot (facultatif)</label>
      <textarea id="r-msg" maxlength="500"></textarea>
      <button type="submit">Envoyer ma réponse</button>
      <div class="note">Nous avons hâte de partager ce jour avec vous 💛</div>`;
    wrap.appendChild(f);
    if(saved){
      f.querySelector('#r-name').value = saved.name || '';
      f.querySelector(saved.attending ? 'input[value=yes]' : 'input[value=no]').checked = true;
      f.querySelector('#r-count').value = saved.attending ? saved.count : '';
      f.querySelector('#r-count-wrap').style.display = saved.attending ? '' : 'none';
      f.querySelector('#r-count').required = !!saved.attending;
      f.querySelector('#r-all').value = saved.allergies || '';
      f.querySelector('#r-msg').value = saved.message || '';
      f.querySelector('button[type=submit]').textContent = 'Mettre à jour ma réponse';
      wrap.querySelector('h3').textContent = 'Votre réponse';
      const info = el('div','dupe-info','Vous avez déjà répondu : vous pouvez la modifier ci-dessous.');
      wrap.insertBefore(info, f);
    }
    f.addEventListener('change', ()=>{
      const yes = f.att.value==='yes';
      f.querySelector('#r-count-wrap').style.display = yes ? '' : 'none';
      f.querySelector('#r-count').required = yes;
    });
    f.noValidate = true;   // we show our own friendly messages
    f.addEventListener('input', (ev)=>{ ev.target.classList.remove('invalid'); const n = ev.target.nextElementSibling; if(n && n.classList.contains('err')) n.remove(); });
    f.addEventListener('submit', async (e)=>{
      e.preventDefault();
      f.querySelectorAll('.err').forEach(x=>x.remove());
      const yes = f.att.value==='yes';
      const nameVal = f.querySelector('#r-name').value.trim().replace(/\s+/g,' ');
      const countVal = parseInt(f.querySelector('#r-count').value,10);
      function showError(field, msg){
        const m = el('div','err',msg);
        field.insertAdjacentElement('afterend', m);                     // right under that field
        field.classList.add('invalid');
        return m;
      }
      const problems = [];
      if(nameVal.split(' ').filter(Boolean).length < 2) problems.push(showError(f.querySelector('#r-name'), "Merci d'indiquer votre nom et votre prénom."));
      if(yes && !(countVal >= 1 && countVal <= 20)) problems.push(showError(f.querySelector('#r-count'), "Merci d'indiquer le nombre de personnes (entre 1 et 20)."));
      if(problems.length){
        const first = problems[0].previousElementSibling;
        first.focus({preventScroll:true});
        problems[0].scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      const btn = f.querySelector('button[type=submit]');
      const data = { name: nameVal, attending: yes, count: yes ? countVal : 0,
        allergies: f.querySelector('#r-all').value.trim() || null, message: f.querySelector('#r-msg').value.trim() || null };
      f.querySelectorAll('.dupe').forEach(x=>x.remove());

      async function call(mode, matchId){
        if(PREVIEW) return { status:'created', id:'apercu' };   // aperçu : aucune écriture
        const res = await fetch(SUPABASE_URL+'/rest/v1/rpc/submit_rsvp', { method:'POST',
          headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' },
          body: JSON.stringify({ p_invitation_id: inv.id, p_name: data.name, p_attending: data.attending, p_count: data.count,
            p_allergies: data.allergies, p_message: data.message, p_mode: mode, p_match_id: matchId || null }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const r = await res.json();
        if(r.status === 'error') throw new Error('refused: '+r.reason);
        return r;
      }
      function finish(updated, id){
        try{ localStorage.setItem(storeKey, JSON.stringify({ id, name: data.name, attending: data.attending, count: data.count, allergies: data.allergies, message: data.message })); }catch(_){}
        wrap.textContent='';
        const ok = el('div','confirm');
        ok.appendChild(el('div','confirm-emoji', yes ? '💐' : '💌'));
        ok.appendChild(el('div','confirm-title', updated ? 'Réponse modifiée, merci !' : (yes ? "C'est noté, merci !" : 'Merci de nous avoir prévenus')));
        ok.appendChild(el('div','confirm-recap', data.name + ' — ' + (yes ? (data.count>1 ? 'présents ('+data.count+' personnes)' : 'présent(e)') : 'ne pourra pas venir')));
        if(yes && inv.event_date){
          const d = new Date(inv.event_date+'T12:00:00');
          let t = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
          ok.appendChild(el('div','confirm-when', 'Rendez-vous le ' + t + (inv.event_time ? ' à ' + inv.event_time : '')));
        }
        ok.appendChild(el('div','confirm-fun', yes ? 'Vivement le grand jour ! 💍' : 'Vous allez nous manquer 💕'));
        const edit = el('button','confirm-edit','Modifier ma réponse'); edit.type = 'button';
        edit.addEventListener('click', ()=> wrap.replaceWith(buildRsvp(inv)));
        ok.appendChild(edit);
        wrap.appendChild(ok);
      }
      function failSend(){
        btn.disabled=false; btn.textContent = saved ? 'Mettre à jour ma réponse' : 'Envoyer ma réponse';
        f.insertBefore(el('div','err','Oups, l\'envoi a échoué. Réessayez dans un instant.'), btn);
      }
      function askModify(r){
        btn.disabled = false; btn.textContent = saved ? 'Mettre à jour ma réponse' : 'Envoyer ma réponse'; btn.style.display = 'none';
        const box = el('div','dupe');
        box.appendChild(el('div','dupe-title','Vous avez déjà répondu 🙂'));
        box.appendChild(el('div','dupe-text', 'Une réponse existe déjà au nom de « ' + r.match_name + ' ». Voulez-vous la modifier ? Ce que vous venez de saisir remplacera votre réponse précédente.'));
        const yesBtn = el('button','dupe-yes','Oui, modifier ma réponse'); yesBtn.type='button';
        const noBtn = el('button','dupe-no',"Non, c'est une autre personne"); noBtn.type='button';
        const lock = (t)=>{ yesBtn.disabled = noBtn.disabled = true; t.textContent = 'Envoi…'; };
        yesBtn.addEventListener('click', async ()=>{ lock(yesBtn); try{ const x = await call('update', r.match_id); finish(true, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        noBtn.addEventListener('click', async ()=>{ lock(noBtn); try{ const x = await call('new'); finish(false, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        box.appendChild(yesBtn); box.appendChild(noBtn);
        f.insertBefore(box, btn);
        box.scrollIntoView({behavior:'smooth', block:'center'});
      }

      btn.disabled = true; btn.textContent = 'Envoi…';
      try{
        let r;
        // this device already answered with the same name -> modify directly, no question asked
        if(saved && saved.id && normName(saved.name) === normName(data.name)) r = await call('update', saved.id);
        else r = await call('check');
        if(r.status === 'exists'){ askModify(r); return; }
        finish(r.status === 'updated', r.id);
      }catch(err){ failSend(); }
    });
    return wrap;
  }

  // ---- Carte : textes lus dans Supabase (card_text) ou déduits des infos de l'invitation ----
  const CARD_DEFAULTS = { intro:'ont le plaisir de vous inviter à célébrer leur mariage', closing:'Votre présence à nos côtés sera notre plus beau cadeau.' };
  function splitNames(h){ return String(h||'').split(/\s+(?:et|&|\+)\s+|\s*,\s*/i).map(s=>s.trim()).filter(Boolean); }
  function deriveCard(inv){
    const t = Object.assign({}, inv.card_text || {});
    const names = splitNames(inv.host_names);
    const out = {};
    out.monogram = t.monogram != null ? t.monogram : names.map(n=>n.charAt(0).toUpperCase()).join('&');
    out.names    = t.names    != null ? t.names    : (inv.host_names || inv.title || '');
    out.intro    = t.intro    != null ? t.intro    : CARD_DEFAULTS.intro;
    let date = t.date;
    if(date == null && inv.event_date){
      const d = new Date(inv.event_date+'T12:00:00');
      const wd = d.toLocaleDateString('fr-FR',{weekday:'long'});
      const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
      const mo = d.toLocaleDateString('fr-FR',{month:'long'});
      date = cap(wd) + '\n' + d.getDate() + ' ' + cap(mo) + ' ' + d.getFullYear();
    }
    out.date = date || '';
    let time = t.time;
    if(time == null && inv.event_time){
      time = String(inv.event_time).trim().replace(/^(\d{1,2})\s*[:h]\s*(\d{2})?$/i, (m,h,mn)=> h+'h'+(mn||'00'));
      if(/^\d{1,2}h\d{2}$/.test(time)) time = 'à ' + time;
    }
    out.time = time || '';
    out.venue = t.venue != null ? t.venue : (inv.venue_name || '');
    let v2 = t.venue2;
    out.venue2 = v2 || '';
    out.closing = t.closing != null ? t.closing : CARD_DEFAULTS.closing;
    return out;
  }
  const $c = id => document.getElementById(id);
  function fitWidth(box, inner, startCqw, minCqw){
    let s = startCqw; box.style.fontSize = s + 'cqw';
    while(s > minCqw && inner.getBoundingClientRect().width > box.clientWidth - 1){ s -= 0.2; box.style.fontSize = s.toFixed(2) + 'cqw'; }
    return s;
  }
  function fitBox(box, inner, startCqw, minCqw){
    let s = startCqw; box.style.fontSize = s + 'cqw';
    while(s > minCqw && inner.getBoundingClientRect().height > box.clientHeight + 1){ s -= 0.15; box.style.fontSize = s.toFixed(2) + 'cqw'; }
  }
  // monogramme comme sur la carte : A en haut à gauche, petit « & », Y plus bas à droite (boucle sous la ligne), centré dans le cartouche
  function drawMono(box, txt){
    const W = box.clientWidth, H = box.clientHeight; if(!W || !H) return;
    const mm = txt.match(/^\s*(\S)\s*[&+]\s*(\S)\s*$/);
    const cv = document.createElement('canvas').getContext('2d');
    const ext = (ch, f, fam) => { cv.font = f + 'px ' + fam; const m = cv.measureText(ch); return { l:-m.actualBoundingBoxLeft, r:m.actualBoundingBoxRight, asc:m.actualBoundingBoxAscent, desc:m.actualBoundingBoxDescent }; };
    const defs = '<defs><linearGradient id="mg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="'+W+'" y2="'+H+'"><stop offset="0" stop-color="#7C4D0E"/><stop offset=".35" stop-color="#B27C20"/><stop offset=".52" stop-color="#D2A24A"/><stop offset=".72" stop-color="#A8701A"/><stop offset="1" stop-color="#7C4D0E"/></linearGradient></defs>';
    const T = (ch, x, y, f, fam, extra) => '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="'+f.toFixed(1)+'" font-family="'+fam+'" fill="url(#mg)" '+(extra||'')+'>'+ch.replace(/&/g,'&amp;')+'</text>';
    let body = '';
    if(mm){
      const f0 = 100, A = ext(mm[1], f0, 'Ephesis'), YS = 1.1, Y = ext(mm[2], f0*YS, 'Ephesis'), AMP = ext('&', f0*0.5, '"Cormorant Garamond"');
      // repère : x=0 au bord gauche du A, baseline du A en y=0
      const ampF = f0 * 0.5 * (A.asc * 0.4) / AMP.asc;                       // « & » ≈ 40 % de la hauteur du A
      const amp = ext('&', ampF, '"Cormorant Garamond"');
      const xA = -A.l, wA = A.r - A.l, xAmp = wA - amp.l + 0.16*f0, wAmp = amp.r - amp.l;
      const yOff = A.asc * 0.40;                                              // le Y descend plus bas que le A
      const xY = wA + wAmp + 0.30*f0 - Y.l, wY = Y.r - Y.l;
      const x0 = 0, x1 = wA + wAmp + 0.30*f0 + wY;
      const top = -A.asc, bot = yOff + Y.desc, bw = x1 - x0, bh = bot - top;
      const k = Math.min(W*0.66/bw, H*0.62/bh);
      const ox = W/2 - bw*k/2 - x0*k, oy = H/2 - bh*k/2 - top*k;
      body = T(mm[1], ox + xA*k, oy, f0*k, 'Ephesis')
           + T('&', ox + xAmp*k, oy + 0.02*f0*k, ampF*k, "'Cormorant Garamond'", 'font-weight="500"')
           + T(mm[2], ox + xY*k, oy + yOff*k, f0*YS*k, 'Ephesis');
    } else {
      const t = txt.trim(); let f = 100, e = ext(t, f, 'Ephesis'); const k = Math.min(W*0.9/(e.r-e.l), H*0.8/(e.asc+e.desc)); f *= k; e = ext(t, f, 'Ephesis');
      body = T(t, W/2 - (e.l+e.r)/2, H/2 + (e.asc - e.desc)/2, f, 'Ephesis');
    }
    box.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+defs+body+'</svg>';
  }
  function renderCard(inv){
    const c = deriveCard(inv);
    // monogramme
    const mono = $c('c-mono'); mono.style.display = c.monogram ? '' : 'none';
    if(c.monogram) drawMono(mono, String(c.monogram));
    // noms (1 ligne si possible, sinon 2 lignes coupées sur « et »)
    const nm = $c('c-names'), ns = nm.firstChild; ns.className = 'gold'; ns.textContent = c.names;
    nm.style.fontSize = '17cqw';
    if(c.names){
      // « & » toujours au centre exact de la carte (sous le cartouche) : prénom 1 à gauche, prénom 2 à droite
      let done = false;
      const m0 = c.names.match(/^(.+?)\s+(et|&|\+)\s+(.+)$/i);
      if(m0){
        ns.className = 'gold pair'; ns.textContent = '';
        ['n1','amp','n2'].forEach((k,i)=>{ const x = document.createElement('span'); x.className = k; x.textContent = m0[i+1]; ns.appendChild(x); });
        const [n1, amp, n2] = ns.children;
        const fits = () => Math.max(n1.getBoundingClientRect().width, n2.getBoundingClientRect().width) * 2 + amp.getBoundingClientRect().width <= nm.clientWidth - 1;
        let sz = 17; nm.style.fontSize = sz + 'cqw';
        while(sz > 8.4 && !fits()){ sz -= 0.2; nm.style.fontSize = sz.toFixed(2) + 'cqw'; }
        done = fits();
      }
      if(!done){
        ns.className = 'gold'; ns.textContent = c.names;
        const s1 = fitWidth(nm, ns, 17, 8.4);
        if(ns.getBoundingClientRect().width > nm.clientWidth - 1 || s1 < 8.5){
          const m = c.names.match(/^(.+?)\s+(et|&|\+)\s+(.+)$/i);
          if(m){
            ns.textContent = ''; ns.appendChild(document.createTextNode(m[1] + ' ' + m[2])); ns.appendChild(document.createElement('br')); ns.appendChild(document.createTextNode(m[3]));
            let s = 8.4; nm.style.fontSize = s + 'cqw';
            while(s > 4 && (ns.getBoundingClientRect().width > nm.clientWidth - 1 || ns.getBoundingClientRect().height > nm.clientHeight + 1)){ s -= 0.2; nm.style.fontSize = s.toFixed(2) + 'cqw'; }
          } else { fitWidth(nm, ns, 8.4, 3.5); }
        }
      }
    }
    // introduction
    const it = $c('c-intro'); it.firstChild.textContent = c.intro; fitBox(it, it.firstChild, 3.6, 1.8);
    // lignes de détails
    const rows = [['r-date', c.date, ''], ['r-time', c.time, ''], ['r-venue', c.venue, c.venue2]];
    rows.forEach(([id, a, b])=>{
      const r = $c(id), sp = r.querySelectorAll('.txt > span');
      sp[0].textContent = a; sp[1] && (sp[1].textContent = b || ''); if(sp[1]) sp[1].style.display = b ? '' : 'none';
      r.style.display = (a || b) ? '' : 'none';
    });
    const rowsBox = $c('c-rows'); let sz = 4.1; rowsBox.style.fontSize = sz + 'cqw';
    const txts = Array.from(rowsBox.querySelectorAll('.crow:not([style*="none"]) .txt'));
    const over = () => txts.some(t => t.scrollHeight > t.clientHeight + 1 || Array.from(t.children).some(x => x.scrollWidth > x.clientWidth + 1));
    while(sz > 2.4 && over()){ sz -= 0.12; rowsBox.style.fontSize = sz.toFixed(2) + 'cqw'; }
    // mot de la fin
    const cl = $c('c-close'); cl.firstChild.textContent = c.closing; fitBox(cl, cl.firstChild, 5.3, 2.8);
    document.querySelectorAll('#card .zone, #c-rows').forEach(z=>z.classList.add('ready'));
  }
  let _lastInv = null;
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(()=>{ if(_lastInv) renderCard(_lastInv); });
  let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{ if(_lastInv) renderCard(_lastInv); }, 150); });


  // ---- Compte à rebours jusqu'à l'événement ----
  function buildCountdown(inv){
    if(!inv.event_date) return document.createDocumentFragment();
    const [y,m,d] = inv.event_date.split('-').map(Number);
    let h = 0, mi = 0; const t = String(inv.event_time||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})?/); if(t){ h = +t[1]; mi = +(t[2]||0); }
    const target = new Date(y, m-1, d, h, mi, 0);
    const wrap = el('div','cd'), title = el('div','cd-title'), grid = el('div','cd-grid');
    const cells = ['jours','heures','minutes','secondes'].map(l=>{ const c = el('div','cd-cell'); const n = el('b','cd-n','00'); c.appendChild(n); c.appendChild(el('span','cd-l',l)); grid.appendChild(c); return n; });
    wrap.appendChild(title); wrap.appendChild(grid);
    let timer = null;
    function tick(){
      let s = Math.floor((target - new Date())/1000);
      if(s <= 0){
        const now = new Date();
        title.textContent = (now.getFullYear()===y && now.getMonth()===m-1 && now.getDate()===d) ? "C'est aujourd'hui !" : "L'événement a eu lieu ✨";
        grid.style.display = 'none'; if(timer) clearInterval(timer); return;
      }
      title.textContent = 'Rendez-vous dans'; grid.style.display = '';
      const dd = Math.floor(s/86400); s %= 86400; const hh = Math.floor(s/3600); s %= 3600; const mm = Math.floor(s/60), ss = s % 60;
      [dd,hh,mm,ss].forEach((v,i)=>{ cells[i].textContent = String(v).padStart(i===0 && dd>99 ? 3 : 2, '0'); });
    }
    timer = setInterval(tick, 1000); tick();
    return wrap;
  }

  async function loadInfos(){
    const box = document.getElementById('info-card');
    try{
      let data;
      if(LIVE){ const one = await waitLive(); data = one ? [one] : []; }
      else if(PREVIEW){
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_preview', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_code: PREVIEW }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const one = await res.json(); data = one ? [one] : [];
      } else {
        const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_invitation', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug }) });
        if(!res.ok) throw new Error('HTTP '+res.status);
        const one = await res.json(); data = one ? [one] : [];
      }
      box.textContent = '';
      if(!data.length){ box.appendChild(el('div','status','Invitation introuvable.')); return; }
      const inv = data[0];
      _lastInv = inv; renderCard(inv);
      if(inv.music_tracks && inv.music_tracks.url) window.onMusicReady(inv.music_tracks.url);

      box.appendChild(el('h2', null, inv.title));
      if(inv.host_names) box.appendChild(el('div','host', inv.host_names));
      box.appendChild(buildCountdown(inv));

      const rows = el('div','info-rows');
      if(inv.event_date){
        const d = new Date(inv.event_date+'T12:00:00');
        let txt = d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
        txt = txt.charAt(0).toUpperCase()+txt.slice(1);
        rows.appendChild(row('📅','Date', document.createTextNode(txt)));
      }
      if(inv.event_time) rows.appendChild(row('🕒','Heure', document.createTextNode(inv.event_time)));
      if(inv.venue_name || inv.address){
        const wrap = document.createElement('span');
        const vn = (inv.venue_name||'').trim(), ad = (inv.address||'').trim(); const label = (vn && ad && ad.toLowerCase().indexOf(vn.toLowerCase()) === 0) ? ad : [vn, ad].filter(Boolean).join(' — ');
        wrap.appendChild(document.createTextNode(label));
        wrap.appendChild(buildNavLinks(inv, label));
        rows.appendChild(row('📍','Lieu', wrap));
      }
      if(inv.contact_name || inv.contact_phone){
        const wrap = document.createElement('span');
        if(inv.contact_name) wrap.appendChild(document.createTextNode(inv.contact_name + (inv.contact_phone?' — ':'')));
        if(inv.contact_phone) wrap.appendChild(link('tel:'+inv.contact_phone.replace(/\s/g,''), inv.contact_phone));
        rows.appendChild(row('📞','Contact', wrap));
      }
      if(inv.dress_code) rows.appendChild(row('👗','Dress code', document.createTextNode(inv.dress_code)));
      if(rows.children.length) box.appendChild(rows);
      if(inv.message) box.appendChild(el('p','info-message', inv.message));

      if(inv.rsvp_enabled) box.appendChild(buildRsvp(inv));

      const prog = (inv.invitation_programme||[]).sort((a,b)=>a.position-b.position);
      if(prog.length){
        const p = el('div','prog'); p.appendChild(el('h3',null,'Programme'));
        prog.forEach(s=>{
          const it = el('div','prog-item'); it.appendChild(el('div','t', s.time||''));
          const w = el('div'); w.appendChild(el('div','n', s.title));
          if(s.description) w.appendChild(el('div','d', s.description));
          it.appendChild(w); p.appendChild(it);
        });
        box.appendChild(p);
      }
    }catch(e){
      box.textContent=''; box.appendChild(el('div','status','Impossible de charger les informations pour le moment.'));
    }
  }
  loadInfos();
</script>
</body>
</html>
