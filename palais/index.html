*{box-sizing:border-box;margin:0;padding:0}
:root{ --rose-vif:#E2B77A; --or:#b8862f; --or-clair:#E3BE6B; --or2:#d9b15c; --encre:#4a2f1d; --creme:#fbf1dc; --bordeaux:#4A1F2A; }
html,body{height:100%}
body{ font-family:'Jost',system-ui,sans-serif; color:var(--encre); background:#120c07; height:100vh; height:100dvh; overflow:hidden;}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }
/* ---------- INTRO ---------- */
  #intro{ position:fixed; inset:0; z-index:60; background:#000; display:flex; align-items:center; justify-content:center;
    transition:opacity 1.3s ease, visibility 1.3s ease;}
  #intro video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.96;}
  #intro-overlay{ position:absolute; left:0; right:0; bottom:calc(9% + env(safe-area-inset-bottom,0px)); z-index:2; text-align:center; padding:0 1.2rem;}
  #enter-btn, #skip-btn{ font-family:'PacificoLocal','Pacifico', cursive; font-weight:400; font-size:1.35rem;
    color:#D9A94A; background:rgba(255,255,255,.16); border:1.5px solid rgba(255,255,255,.6);
    padding:.55rem 2rem .7rem; cursor:pointer; border-radius:999px;
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    text-shadow:0 0 10px rgba(255,255,255,.9), 0 1px 2px rgba(255,255,255,.8);
    transition:transform .25s ease, background .25s ease;}
  #enter-btn:hover{ transform:scale(1.04); background:rgba(255,255,255,.26);}
  #intro.hidden{ opacity:0; visibility:hidden; pointer-events:none;}

  
#app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity 1.6s ease .1s;}
#app.show{ opacity:1;}
#music-toggle{ position:fixed; top:1.1rem; right:1.1rem; z-index:20; width:42px; height:42px; border-radius:50%;
    border:2px solid var(--rose-vif); background:rgba(50,30,15,.5); color:#fff; cursor:pointer; font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;}


  
#enter-btn, #skip-btn{ font-family:'Great Vibes',cursive; font-size:2rem; line-height:1.1; padding:.45rem 2.1rem .6rem; border:2px solid transparent; border-radius:999px;
    background:linear-gradient(rgba(255,248,235,.72),rgba(255,248,235,.72)) padding-box, linear-gradient(100deg,#E3BE6B,#B8862B,#E3BE6B) border-box;
    box-shadow:0 8px 26px rgba(80,50,10,.35); text-shadow:none; color:transparent;}
  #enter-btn:hover{ background:linear-gradient(rgba(255,250,240,.88),rgba(255,250,240,.88)) padding-box, linear-gradient(100deg,#E3BE6B,#B8862B,#E3BE6B) border-box;}
  #enter-btn span, #skip-btn span{ background:linear-gradient(100deg,#8C5A12,#C9922E 50%,#8C5A12); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; padding:0 .1em;}
  #music-toggle{ border-color:var(--or-clair); }

  
#skip-btn{ position:absolute; z-index:5; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; bottom:auto; left:auto; transform:none;
    font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:600; letter-spacing:.04em; font-size:.95rem; line-height:1.2; padding:.2rem 1.15rem .34rem; border-width:1.5px; opacity:.9;}
  #skip-btn:hover{ transform:none; }

  
@media (min-aspect-ratio:3/4){ #intro video{ object-fit:contain !important; } }
/* ================= mise en page plein écran (maquette validée) ================= */







*{box-sizing:border-box;margin:0;padding:0}
:root{--or:#b8862f;--or2:#d9b15c;--encre:#4a2f1d;--creme:#fbf1dc;--vh:100svh}
/* le « téléphone » : plein écran sur mobile, colonne centrée sur ordinateur */
#stage{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,calc(100svh * .5));transform:translateX(-50%);overflow:hidden;background:var(--creme)}
/* décor permanent : il ne bouge jamais, seuls les textes se fondent */
.bg{position:absolute;inset:0;background:var(--creme)}
.bg .mid{position:absolute;inset:0;background:url(maquette/mid.jpg) center top/100% auto repeat-y}
.bg .top{position:absolute;left:0;right:0;top:0;aspect-ratio:780/460;background:url(maquette/top.jpg) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.bg .bot{position:absolute;left:0;right:0;bottom:0;aspect-ratio:780/207;background:url(maquette/bot.jpg) center/100% 100% no-repeat;-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
.dust{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#f3d98f;box-shadow:0 0 8px 2px rgba(240,205,120,.8);opacity:0;animation:up linear infinite}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-95svh) translateX(14px);opacity:0}}
/* les tableaux : superposés, ils se fondent l'un dans l'autre au défilement */
.tab{position:absolute;inset:0;opacity:0;will-change:opacity,transform,filter;pointer-events:none;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(var(--top) + 1.2rem) 12% calc(var(--bot) + 2.5rem)}
#stage{--top:calc(min(100vw,100svh*.5) * .59 * 1);--bot:calc(min(100vw,100svh*.5) * .15)}
.tab.on{pointer-events:auto}
.plate{position:absolute;left:50%;top:calc(min(100vw,100svh*.5) * .171);width:40%;height:calc(min(100vw,100svh*.5) * .25);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.plate .s{font:400 clamp(1.5rem,7.4cqw,2.2rem)/1.02 'Great Vibes',cursive;color:var(--or);text-shadow:0 1px 0 rgba(255,255,255,.7)}
.plate .a{font:600 .5rem 'Jost',sans-serif;letter-spacing:.28em;text-transform:uppercase;color:var(--or)}
.plate .n{font:400 clamp(1.45rem,7.2cqw,2.1rem)/1 'Great Vibes',cursive;color:#a8741f;white-space:nowrap}
.plate .and{font:italic 500 .95rem 'Cormorant Garamond',serif;color:var(--or);margin:.05rem 0}
.body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:0;gap:.7rem}
.lead{font:italic 500 clamp(1rem,4.6cqw,1.25rem)/1.35 'Cormorant Garamond',serif;color:var(--encre);max-width:17rem}
.flo{width:min(14rem,60%);height:auto}
.big{font:600 clamp(1.15rem,5.6cqw,1.5rem)/1.2 'Cormorant Garamond',serif;color:var(--encre);letter-spacing:.02em}
.sm{font:500 .7rem 'Jost',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--or)}
/* programme */
.prog{list-style:none;position:relative;width:100%;display:grid;gap:clamp(.45rem,1.9svh,1rem);padding:.2rem 0}
.prog::before{content:'';position:absolute;left:calc(26% + 1.2rem);top:1.4rem;bottom:1.4rem;width:1px;background:linear-gradient(transparent,var(--or2) 12%,var(--or2) 88%,transparent)}
.pr{display:grid;grid-template-columns:26% 2.4rem 1fr;align-items:center;gap:.8rem;text-align:left}
.pr .t{font:500 .85rem 'Jost',sans-serif;letter-spacing:.14em;color:var(--or);text-align:right}
.pr .ic{width:2.4rem;height:2.9rem;display:grid;place-items:center;border:1px solid var(--or2);border-radius:1.2rem 1.2rem .4rem .4rem;background:rgba(255,250,238,.9);color:var(--or);box-shadow:0 2px 10px rgba(184,134,47,.22);position:relative;z-index:1}
.pr .ic svg{width:1.3rem;height:1.3rem}
.pr .d b{display:block;font:600 clamp(1rem,4.6cqw,1.2rem)/1.1 'Cormorant Garamond',serif;color:var(--encre)}
.pr .d i{font:italic 500 .8rem/1.2 'Cormorant Garamond',serif;color:#7a5a37}
/* lieu */
.arch{width:62%;aspect-ratio:3/3.5;border-radius:999px 999px 14px 14px;border:1px solid var(--or2);padding:6px;background:rgba(255,250,238,.7);box-shadow:0 14px 30px rgba(120,80,20,.28)}
.arch div{width:100%;height:100%;border-radius:999px 999px 8px 8px;background:url(maquette/lieu.jpg) center/cover}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.btn{font:600 .78rem 'Jost',sans-serif;letter-spacing:.08em;color:var(--or);border:1px solid var(--or);border-radius:999px;padding:.6rem 1.1rem;background:rgba(255,250,238,.6);text-decoration:none}
.btn.pl{background:linear-gradient(180deg,#d9b15c,#b8862f);color:#fffaf0;border-color:transparent;box-shadow:0 6px 16px rgba(160,110,30,.35)}
/* réponse */
.fm{width:100%;display:grid;gap:.55rem;text-align:left}
.fm label{font:600 .62rem 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--or)}
.fm .in{margin-top:.2rem;height:2.4rem;border:1px solid rgba(196,150,63,.55);border-radius:12px;background:rgba(255,252,245,.85);padding:.55rem .8rem;font:400 .9rem 'Jost',sans-serif;color:#9b8a72}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.fm .ch{height:2.4rem;border:1px solid rgba(196,150,63,.55);border-radius:999px;display:grid;place-items:center;font:500 .8rem 'Jost',sans-serif;color:var(--encre);background:rgba(255,252,245,.85)}
.fm .ch.on{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or);color:var(--or);font-weight:600}
/* hint + points */
.hint{position:absolute;left:0;right:0;bottom:calc(var(--bot) * .42);text-align:center;font:600 .62rem 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--or);z-index:5;transition:opacity .6s;pointer-events:none}
.hint b{display:block;font-size:1.1rem;font-weight:400;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.dots{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:grid;gap:10px;z-index:6}
.dots button{width:9px;height:13px;border:1px solid var(--or);border-radius:9px 9px 2px 2px;background:transparent;opacity:.7;cursor:pointer;padding:0;transition:all .4s}
.dots button.on{background:var(--or);opacity:1;height:18px}
#track{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;z-index:4;-webkit-overflow-scrolling:touch}
#track::-webkit-scrollbar{display:none}
#track i{display:block;height:100svh;scroll-snap-align:start;scroll-snap-stop:always}
/* ouverture : la vidéo des portes occupe tout l'écran, puis se fond dans la carte */

<script>
const video = document.getElementById('intro-video');
  video.load();

  const introEl = document.getElementById('intro');
  const appEl = document.getElementById('app');
  const enterBtn = document.getElementById('enter-btn');


  /* entrée : fondu doré sur tout l'écran, la carte n'apparaît qu'une fois l'écran entièrement doré */
  let _entering = false;
  function enterSite(){
    if(_entering) return; _entering = true;
    const g = document.getElementById('glow');
    g.style.transition = 'opacity 1.5s cubic-bezier(.4,0,.2,1)'; g.style.opacity = 1;
    setTimeout(()=>{
      introEl.style.transition = 'none'; introEl.classList.add('hidden');
      appEl.style.transition = 'none'; appEl.classList.add('show');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        g.style.transition = 'opacity 2.2s cubic-bezier(.3,0,.2,1)'; g.style.opacity = 0;
      }));
    }, 1850);
  }

  const bgm = document.getElementById('bg-music');
  bgm.loop = true;
  let started = false;
  function startWithSound(){
    if(started) return;
    started = true;
    document.getElementById('intro-overlay').style.display = 'none';
    bgm.play().catch(()=>{});          // silent unlock inside the tap (needed by phones)
    video.muted = !!musicUrl;          // custom music replaces the video's own sound
    video.currentTime = 0;
    video.play().catch(()=>{ enterSite(); });
    if(musicUrl) startMusic();
  }
  video.addEventListener('ended', enterSite);
  enterBtn.addEventListener('click', startWithSound);
  document.getElementById('skip-btn').addEventListener('click', ()=>{ startWithSound(); try{ video.pause(); }catch(_){} enterSite(); });
  setTimeout(()=>{ if(document.querySelector('div[style*="2147483000"]')) document.getElementById('skip-btn').style.top='calc(58px + env(safe-area-inset-top,0px))'; }, 400);

  
// ---- Background music (chosen per invitation in Supabase) ----
  const SILENT = 'data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUAGAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
  bgm.src = SILENT; bgm.dataset.src = 'silent';
  const musicBtn = document.getElementById('music-toggle');
  let musicUrl = null, musicPlaying = false;
  function updateBtn(){ musicBtn.textContent = musicPlaying ? '♫' : '♪'; musicBtn.style.opacity = musicPlaying ? '1' : '.75'; }
  let userPaused = false;
  function startMusic(){
    if(!musicUrl) return;
    if(bgm.dataset.src !== musicUrl){ bgm.src = musicUrl; bgm.dataset.src = musicUrl; }
    bgm.loop = true; bgm.muted = false; bgm.volume = 0.7;
    video.muted = true;
    bgm.play().then(()=>{ musicPlaying = true; userPaused = false; updateBtn(); })
      .catch(()=>{ musicPlaying = false; updateBtn(); });   // blocked by the browser: retried at the next tap
  }
  // if the browser blocked the music, retry at the guest's next tap
  ['pointerdown','touchend','click'].forEach(ev => document.addEventListener(ev, ()=>{
    if(musicUrl && started && !musicPlaying && !userPaused) startMusic();
  }, {passive:true}));
  window.onMusicReady = function(url){ musicUrl = url; musicBtn.style.display = 'flex'; if(started) startMusic(); };
  musicBtn.addEventListener('click', function(){
    if(!musicUrl) return;
    if(bgm.paused || bgm.dataset.src !== musicUrl){ startMusic(); }
    else { bgm.pause(); musicPlaying = false; userPaused = true; updateBtn(); }
  });
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){ if(musicPlaying) bgm.pause(); }
    else if(musicPlaying){ bgm.play().catch(()=>{}); }
  });

  
// ---- Supabase: load invitation infos ----
  const SUPABASE_URL = 'https://sgatagagyfizuyrinmth.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YdlXEbQn9ZqILsjT6pyAug_ijgzm5fQ';
  const slug = new URLSearchParams(location.search).get('i') || 'palais-demo';
  const PREVIEW = new URLSearchParams(location.search).get('preview');
  const LIVE = new URLSearchParams(location.search).get('live');
  function waitLive(){ return new Promise(function(res){
    window.addEventListener('message', async function h(e){
      if(e.origin !== location.origin || !e.data || e.data.type !== 'live') return;
      window.removeEventListener('message', h); const inv = e.data.inv;
      if(!(inv.music_tracks && inv.music_tracks.url)){ try{ const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_invitation', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug }) }); const j = await r.json(); if(j && j.music_tracks) inv.music_tracks = j.music_tracks; }catch(_){} }
      res(inv); });
    try{ parent.postMessage({ type:'live-ready' }, location.origin); }catch(_){}
  }); }
  if(PREVIEW){ const _g = document.createElement('script'); _g.src = '../preview-guard.js';
    _g.onerror = function(){ document.body.textContent = 'Aperçu indisponible pour le moment.'; }; document.head.appendChild(_g); }

  function link(href, text){ const a=el('a',null,text); a.href=href; a.target='_blank'; a.rel='noopener'; return a; }


  function normName(n){ return String(n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).sort().join(' '); }
  function buildRsvp(inv){
    const storeKey = 'rsvp_' + inv.id;
    let saved = null; try{ saved = JSON.parse(localStorage.getItem(storeKey) || 'null'); }catch(_){}
    const wrap = el('div','rsvp');
    wrap.appendChild(el('h3',null,'Confirmez votre présence'));
    const f = document.createElement('form');
    f.innerHTML = `

      if(yes && !(countVal >= 1 && countVal <= 20)) problems.push(showError(f.querySelector('#r-count'), "Merci d'indiquer le nombre de personnes (entre 1 et 20)."));
      if(problems.length){

            p_allergies: data.allergies, p_message: data.message, p_mode: mode, p_match_id: matchId || null }) });
        if(!res.ok) throw new Error('HTTP '+res.status);

      function finish(updated, id){

        const noBtn = el('button','dupe-no',"Non, c'est une autre personne"); noBtn.type='button';
        const lock = (t)=>{ yesBtn.disabled = noBtn.disabled = true; t.textContent = 'Envoi…'; };
        yesBtn.addEventListener('click', async ()=>{ lock(yesBtn); try{ const x = await call('update', r.match_id); finish(true, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        noBtn.addEventListener('click', async ()=>{ lock(noBtn); try{ const x = await call('new'); finish(false, x.id); }catch(_){ box.remove(); btn.style.display=''; failSend(); } });
        box.appendChild(yesBtn); box.appendChild(noBtn);
        f.insertBefore(box, btn);
        box.scrollIntoView({behavior:'smooth', block:'center'});
      }

      btn.disabled = true; btn.textContent = 'Envoi…';
      try{
        let r;
        // this device already answered with the same name -> modify directly, no question asked
        if(saved && saved.id && normName(saved.name) === normName(data.name)) r = await call('update', saved.id);
        else r = await call('check');
        if(r.status === 'exists'){ askModify(r); return; }
        finish(r.status === 'updated', r.id);
      }catch(err){ failSend(); }
    });

function buildPhotos(inv){
    const demo = !!(PREVIEW || LIVE || inv.is_demo), KEY = 'gp_' + inv.id;
    let st = {}; try{ st = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(_){}
    if(!st.key){ st.key = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40); st.count = 0; }
    const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(_){} };
    const MAX = 30;
    const wrap = el('div','gphotos');
    wrap.appendChild(el('h3',null,'Partagez-nous vos meilleurs moments 📸'));
    wrap.appendChild(el('p','gp-lead','Offrez aux mariés vos plus beaux souvenirs de la fête.'));
    const name = document.createElement('input'); name.type = 'text'; name.placeholder = 'Votre prénom (facultatif)'; name.maxLength = 60; name.autocomplete = 'given-name'; name.value = st.name || '';
    const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/jpeg,image/png,image/webp,image/*'; file.multiple = true; file.style.display = 'none';
    const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Choisir mes photos';
    const msg = el('div','gp-st');
    const refresh = () => { msg.classList.remove('gp-err'); msg.classList.remove('gp-lock'); msg.textContent = demo ? 'Démonstration : sur la vraie invitation, vos invités envoient ici leurs photos.' : (st.count ? st.count + ' / ' + MAX + ' photo' + (st.count > 1 ? 's' : '') + ' envoyée' + (st.count > 1 ? 's' : '') + '. Merci !' : ''); btn.disabled = st.count >= MAX; };
    function shrink(f){
      return new Promise((res, rej) => {
        const url = URL.createObjectURL(f), im = new Image();
        im.onload = () => { const k = Math.min(1, 2000 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error('conv')), 'image/jpeg', 0.85); };
        im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('format')); }; im.src = url;
      });
    }
    async function sendOne(f){
      const blob = await shrink(f);
      const r = await fetch(SUPABASE_URL + '/functions/v1/guest-photos', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY }, body: JSON.stringify({ action:'request', slug:inv.slug, guest_key:st.key, name:name.value.trim(), type:'image/jpeg', size:blob.size }) });
      const j = await r.json().catch(() => ({}));
      if(r.status === 429 && j.error === 'limit'){ st.count = MAX; save(); throw new Error('limit'); }
      if(!r.ok || !j.url) throw new Error(j.error || 'refus');
      const fd = new FormData(); fd.append('cacheControl', '31536000'); fd.append('', blob);
      const u = await fetch(j.url, { method:'PUT', body: fd }); if(!u.ok) throw new Error('envoi');
      const d = await fetch(SUPABASE_URL + '/functions/v1/guest-photos', { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY }, body: JSON.stringify({ action:'done', slug:inv.slug, guest_key:st.key, id:j.id }) });
      const dj = await d.json().catch(() => ({})); st.count = dj.count != null ? dj.count : st.count + 1; save();
    }
    const drop = document.createElement('div'); drop.className = 'drop'; drop.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg><span>Touchez pour choisir vos photos</span>';
    drop.addEventListener('click', () => btn.click());
    let lockT = null;
    btn.addEventListener('click', () => {
      const lk = photoLock(inv);
      if(lk){ clearTimeout(lockT); msg.classList.remove('gp-err'); msg.classList.add('gp-lock'); msg.textContent = lk; lockT = setTimeout(() => { msg.classList.remove('gp-lock'); refresh(); }, 7000); return; }
      if(demo){ msg.classList.remove('gp-lock'); refresh(); return; }
      file.click();
    });
    file.addEventListener('change', async () => {
      let list = Array.from(file.files || []); file.value = ''; if(!list.length) return;
      st.name = name.value.trim(); save();
      const room = MAX - st.count; let note = '';
      if(list.length > room){ list = list.slice(0, room); note = ' (limite de ' + MAX + ' photos atteinte)'; }
      btn.disabled = true; let ok = 0, ko = 0;
      for(let k = 0; k < list.length; k++){
        msg.classList.remove('gp-err'); msg.textContent = 'Envoi de la photo ' + (k + 1) + ' sur ' + list.length + '…';
        try{ await sendOne(list[k]); ok++; }catch(e){ ko++; if(e.message === 'limit'){ note = ' (limite de ' + MAX + ' photos atteinte)'; break; } }
      }
      refresh(); msg.textContent = (ok ? ok + ' photo' + (ok > 1 ? 's' : '') + ' envoyée' + (ok > 1 ? 's' : '') + ', merci ! ' : '') + (ko ? ko + ' n’' + (ko > 1 ? 'ont' : 'a') + ' pas pu être envoyée' + (ko > 1 ? 's' : '') + '. ' : '') + (st.count ? '(' + st.count + ' / ' + MAX + ')' : '') + note;
      if(ko && !ok) msg.classList.add('gp-err');
    });
    wrap.appendChild(drop); wrap.appendChild(name); wrap.appendChild(btn); wrap.appendChild(file); wrap.appendChild(msg); refresh(); return wrap;
  }
  
// ---- Carte : textes lus dans Supabase (card_text) ou déduits des infos de l'invitation ----
  const CARD_DEFAULTS = { intro:'ont le plaisir de vous inviter à célébrer leur mariage', closing:'Votre présence à nos côtés sera notre plus beau cadeau.' };
  function splitNames(h){ return String(h||'').split(/\s+(?:et|&|\+)\s+|\s*,\s*/i).map(s=>s.trim()).filter(Boolean); }
  function deriveCard(inv){
    const t = Object.assign({}, inv.card_text || {});
    const names = splitNames(inv.host_names);
    const out = {};
    out.monogram = t.monogram != null ? t.monogram : names.map(n=>n.charAt(0).toUpperCase()).join('&');
    out.names    = t.names    != null ? t.names    : (inv.host_names || inv.title || '');
    out.intro    = t.intro    != null ? t.intro    : CARD_DEFAULTS.intro;
    let date = t.date;
    if(date == null && inv.event_date){
      const d = new Date(inv.event_date+'T12:00:00');
      const wd = d.toLocaleDateString('fr-FR',{weekday:'long'});
      const cap = x => x.charAt(0).toUpperCase()+x.slice(1);
      const mo = d.toLocaleDateString('fr-FR',{month:'long'});
      date = cap(wd) + '\n' + d.getDate() + ' ' + cap(mo) + ' ' + d.getFullYear();
    }
    out.date = date || '';
    let time = t.time;
    if(time == null && inv.event_time){
      time = String(inv.event_time).trim().replace(/^(\d{1,2})\s*[:h]\s*(\d{2})?$/i, (m,h,mn)=> h+'h'+(mn||'00'));
      if(/^\d{1,2}h\d{2}$/.test(time)) time = 'à ' + time;
    }
    out.time = time || '';
    out.venue = t.venue != null ? t.venue : (inv.venue_name || '');
    let v2 = t.venue2;
    out.venue2 = v2 || '';
    out.closing = t.closing != null ? t.closing : CARD_DEFAULTS.closing;
    return out;
  }

function eventTarget(inv){
  if(!inv.event_date) return null;
  const [y,m,d] = inv.event_date.split('-').map(Number);
  let h = 0, mi = 0; const t = String(inv.event_time||'').match(/(\d{1,2})\s*[:hH]\s*(\d{2})?/); if(t){ h = +t[1]; mi = +(t[2]||0); }
  return new Date(y, m-1, d, h, mi, 0);
}
function longDate(inv){
  if(!inv.event_date) return '';
  const d = new Date(inv.event_date+'T12:00:00');

}

function drawMonoIn(box,txt,bi){
  const t = String(txt||'').trim(); if(!t){ box.innerHTML = ''; return; }
  const cv = document.createElement('canvas').getContext('2d');
  const ink = (s, font) => { cv.font = font; const m = cv.measureText(s); return { l:m.actualBoundingBoxLeft, r:m.actualBoundingBoxRight, a:m.actualBoundingBoxAscent, d:m.actualBoundingBoxDescent }; };
  const mm = t.match(/^(\S)\s*[&+]\s*(\S)$/) || (t.length === 2 ? [t, t[0], t[1]] : null);
  let letters, inkW;
  const GAP = 10;
  if(mm){
    const fL = '98px Ephesis', fA = "italic 500 28px 'Cormorant Garamond'";
    const A = ink(mm[1], fL), S = ink('&', fA), B = ink(mm[2], fL);
    const wA = A.l + A.r, wS = S.l + S.r, wB = B.l + B.r;
    inkW = wA + wS + wB + 2*GAP;
    let x = 150 - inkW/2;
    const cyL = ((A.a - A.d)/2 + (B.a - B.d)/2) / 2;
    const yL = 100 + cyL, yS = 100 + (S.a - S.d)/2;
    letters = '<text x="' + (x + A.l).toFixed(1) + '" y="' + yL.toFixed(1) + '" font-size="98">' + esc(mm[1]) + '</text>';
    x += wA + GAP;
    letters += '<text x="' + (x + S.l).toFixed(1) + '" y="' + yS.toFixed(1) + '" font-size="28" font-family="Cormorant Garamond, serif" font-style="italic" font-weight="500">&amp;</text>';
    x += wS + GAP;
    letters += '<text x="' + (x + B.l).toFixed(1) + '" y="' + yL.toFixed(1) + '" font-size="98">' + esc(mm[2]) + '</text>';
  } else {
    let fs = Math.max(40, Math.min(110, 300 / Math.max(1, t.length) * 1.25));
    const M = ink(t, fs + 'px Ephesis');
    inkW = M.l + M.r;
    letters = '<text x="' + (150 - inkW/2 + M.l).toFixed(1) + '" y="' + (100 + (M.a - M.d)/2).toFixed(1) + '" font-size="' + fs.toFixed(0) + '">' + esc(t) + '</text>';

function nw(n){
  if(n < 20) return U20[n];
  const t = Math.floor(n/10), u = n % 10;
  const T = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  if(t === 7 || t === 9) return T[t] + (t === 7 && u === 1 ? ' et onze' : '-' + U20[10 + u]);
  if(t === 8) return u ? 'quatre-vingt-' + U20[u] : 'quatre-vingts';
  if(u === 0) return T[t];
  return T[t] + (u === 1 ? ' et un' : '-' + U20[u]);
}

    const head = parts.shift() || raw;
    const rest = parts.join(' ');
    const COL = {'rose poudré':'#e6bdb4','rose pâle':'#f0cfd0','rose':'#e8b4b8','vert sauge':'#9caf88','sauge':'#9caf88','sable':'#d9c4a0','beige':'#dcc9aa','champagne':'#ecd9b0','ivoire':'#f4ecdc','crème':'#f6ecd6','terracotta':'#c46f4e','doré':'#c9a24a','or':'#c9a24a','lavande':'#b8a7d6','lilas':'#c3b0d8','olive':'#7b7d3c','bordeaux':'#6d1f2c','bleu marine':'#1f2f55','bleu nuit':'#1a2347','bleu ciel':'#9dbfdc','bleu':'#5b7fb0','vert émeraude':'#1f7a5b','émeraude':'#1f7a5b','vert':'#6f9a6b','rouge':'#a8282e','corail':'#e8836b','moutarde':'#d4a017','taupe':'#8b7765','gris':'#a3a3a3','pêche':'#f2c4a4','menthe':'#b9dcc5','camel':'#b98b52','kaki':'#8a8a55'};
    const scope = raw.split(/[ée]vit|sans |pas de |hors /i)[0].toLowerCase();
    const sw = []; Object.keys(COL).sort((x,y)=>y.length-x.length).forEach(k=>{ const i = scope.indexOf(k); if(i > -1 && !sw.some(o=>scope.indexOf(o.k) <= i && i < scope.indexOf(o.k)+o.k.length)) sw.push({k:k,i:i}); });
    sw.sort((x,y)=>x.i-y.i);
    let h = '<div class="dc-frame"><p class="dc-head">' + esc(head) + '</p>';
    if(sw.length >= 2) h += '<div class="dc-sw">' + sw.slice(0,6).map(o=>'<span><i style="background:' + COL[o.k] + '"></i><em>' + esc(o.k) + '</em></span>').join('') + '</div>';
    if(rest) h += '<p class="dc-rest">' + esc(rest) + '</p>';
    h += '</div>';
    tabs.push(sec('t-dress', 'Pour nous faire plaisir', 'Dress code', h));
  }
  // 3c. contacts
  {
    let list = [];
    if(Array.isArray(inv.contacts)) list = inv.contacts.map(c=>({name:c.name||'', role:c.role||'', phone:c.phone||''}));
    else if(inv.contact_name || inv.contact_phone){
      const nm = String(inv.contact_name||'').split(/\s*(?:;|\/|\||\n| & | et )\s*/).filter(Boolean);
      const ph = String(inv.contact_phone||'').split(/\s*(?:;|\/|\||\n)\s*/).filter(Boolean);
      const n = Math.max(nm.length, ph.length, 1);
      for(let i=0;i<n;i++) list.push({name:nm[i]||'', role:'', phone:ph[i]||''});
    }
    list = list.filter(c=>c.name||c.phone);
    if(inv.is_demo && list.length < 3){ [{name:'Sarah',role:'Témoin de la mariée',phone:'06 12 34 56 78'},{name:'Karim',role:'Témoin du marié',phone:'06 98 76 54 32'},{name:'Nadia',role:'Mère de la mariée',phone:'07 11 22 33 44'}].forEach(x=>{ if(list.length < 3 && !list.some(c=>c.name===x.name)) list.push(x); }); }
    if(list.length){
      const tel = p => String(p).replace(/[^\d+]/g,'');
      const ico = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3.2l1.6 4-2 1.3a11 11 0 005.9 5.9L15 13.2l4 1.6V18a2 2 0 01-2 2A13 13 0 013 6a2 2 0 012-2z"/></svg>';
      const rows = list.map(c=>'<div class="ct">' + (c.name ? '<b>' + esc(c.name) + '</b>' : '') + (c.role ? '<i>' + esc(c.role) + '</i>' : '') + (c.phone ? '<a class="ct-p" href="tel:' + esc(tel(c.phone)) + '">' + ico + esc(c.phone) + '</a>' : '') + '</div>').join('');
      const s = sec('t-contact', 'Besoin de nous joindre', 'Contact', '<p class="sm">Une question ? Un imprévu ?</p><div class="cts n' + Math.min(list.length,5) + '">' + rows + '</div>');
      tabs.push(s);
    }
  }
  // 4. réponse
  if(inv.rsvp_enabled){
    const s = sec('t-rsvp', 'RSVP', 'Votre réponse', '');
    s.querySelector('.body').appendChild(buildRsvp(inv)); tabs.push(s);
  }
  // 5. merci
  {
    const s = sec('t-merci', 'Avec toute notre joie', 'Merci', '');
    const body = s.querySelector('.body');
    const cd = buildCountdown(inv); if(cd.children.length) body.appendChild(cd);
    body.insertAdjacentHTML('beforeend', flo('sep2'));
    const lead = document.createElement('p'); lead.className = 'lead'; lead.textContent = inv.message || 'Nous avons hâte de partager ce moment avec vous.'; body.appendChild(lead);
    tabs.push(s);
  }
  // 6. photos (toujours en dernier)
  if(inv.guest_photos_enabled){
    const s = sec('t-photo', 'Partagez vos souvenirs', 'Vos photos', '');
    s.querySelector('.body').appendChild(buildPhotos(inv)); tabs.push(s);
  }
  return tabs;
}

// ---- défilement : les tableaux se fondent l'un dans l'autre ----
let TABS = [], DOTS = [];
const track = document.getElementById('track'), dotsEl = document.getElementById('dots'), hintEl = document.getElementById('hint'), tabsEl = document.getElementById('tabs'), tabs0El = document.getElementById('tabs0'), s0El = document.getElementById('s0'), s1El = document.getElementById('s1'), stageEl = document.getElementById('stage');
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const ease = x => x*x*(3-2*x);
function draw(){
  const p = track.scrollTop / Math.max(1, track.clientHeight);
  TABS.forEach((t,i)=>{
    const d = Math.abs(p-i); let v = ease(Math.max(0, Math.min(1, 1-d*1.7)));
    if(i===0 || (i===1 && p<=1)) v = 1;
    t.style.opacity = v;
    if(i===0 || (i===1 && p<=1)){ t.style.transform = 'none'; t.style.filter = 'none'; }
    else if(!reduce){ t.style.transform = 'translateY(' + ((i-p)*38) + 'px) scale(' + (.965+.035*v) + ')'; t.style.filter = v < .995 ? 'blur(' + ((1-v)*9).toFixed(1) + 'px)' : 'none'; }
    t.classList.toggle('on', i===0 ? p < .5 : (i===1 ? (p >= .5 && v > .6) : v > .6));
  });
  DOTS.forEach((b,i)=> b.classList.toggle('on', Math.round(p) === i));
  { const k = Math.max(0, Math.min(1, p)), H = stageEl.clientHeight;
    s0El.style.transform = 'translate3d(0,' + (-k*H) + 'px,0)'; s0El.style.visibility = k >= 1 ? 'hidden' : 'visible';
    s1El.style.transform = 'translate3d(0,' + ((1-k)*H) + 'px,0)'; }
  hintEl.style.opacity = Math.max(0, Math.min(1, (TABS.length - 1) - p)); hintEl.style.display = TABS.length > 1 ? '' : 'none';
}
track.addEventListener('scroll', ()=>requestAnimationFrame(draw), {passive:true});

// ---- ajustements de taille (noms longs, programme long) ----
function fitAll(){
  const stage = document.getElementById('stage'), W = stage.clientWidth;
  // noms / titres sur une ligne
  document.querySelectorAll('.ttl .n').forEach(n=>{
    n.style.fontSize = ''; n.style.whiteSpace = 'nowrap';
    let fs = parseFloat(getComputedStyle(n).fontSize);
    let guard = 60;
    while(n.getBoundingClientRect().width > W*0.74 && fs > 26 && guard--){ fs -= 1.5; n.style.fontSize = fs + 'px'; }
    if(n.getBoundingClientRect().width > W*0.74){ n.style.whiteSpace = 'normal'; n.style.textAlign = 'center'; n.style.lineHeight = '1.05'; }
  });
  // chaque page : si le contenu dépasse la hauteur disponible, on le réduit pour que tout reste visible
  document.querySelectorAll('.tab .body').forEach(bd=>{
    bd.style.transform = ''; bd.style.width = ''; bd.style.transformOrigin = '';
    const ch = bd.clientHeight, sh = bd.scrollHeight;
    if(ch > 40 && sh > ch + 2){
      const k = Math.max(.55, ch / sh);
      bd.style.transformOrigin = 'top center'; bd.style.width = (100 / k) + '%'; bd.style.transform = 'scale(' + k.toFixed(3) + ')';
    }
  });
}
let _fz; try{ new MutationObserver(()=>{ clearTimeout(_fz); _fz = setTimeout(fitAll, 60); }).observe(document.getElementById('tabs'), {childList:true, subtree:true}); }catch(_){}
let _rz; window.addEventListener('resize', ()=>{ clearTimeout(_rz); _rz = setTimeout(()=>{ fitAll(); draw(); }, 120); });

function demoVenue(inv){
  if(!inv.is_demo || PREVIEW || LIVE) return inv;
  const ct = Object.assign({}, inv.card_text || {}, { venue:'Villa Ephrussi de Rothschild', venue2:'Saint-Jean-Cap-Ferrat' });
  return Object.assign({}, inv, { venue_name:'Villa Ephrussi de Rothschild', address:'1 avenue Ephrussi de Rothschild, 06230 Saint-Jean-Cap-Ferrat', maps_url:'https://www.google.com/maps/search/?api=1&query=Villa+Ephrussi+de+Rothschild+Saint-Jean-Cap-Ferrat', card_text: ct });
}
function mount(inv){
  inv = demoVenue(inv);
  _lastInv = inv;
  const c = deriveCard(inv);
  drawMono(c.monogram);
  tabsEl.innerHTML = ''; tabs0El.innerHTML = ''; dotsEl.innerHTML = ''; track.innerHTML = '';
  TABS = buildPages(inv);
  TABS.forEach((t,i)=>{
    (i===0 ? tabs0El : tabsEl).appendChild(t);
    const bt = document.createElement('button'); bt.type = 'button'; bt.setAttribute('aria-label', 'Section ' + (i+1));
    bt.onclick = ()=> track.scrollTo({top:i*track.clientHeight, behavior:'smooth'}); dotsEl.appendChild(bt);
    track.appendChild(document.createElement('i'));
  });
  DOTS = [].slice.call(dotsEl.children);
  dotsEl.style.display = TABS.length > 1 ? '' : 'none';
  fitAll(); draw();
  const re = ()=>{ fitAll(); drawMono(deriveCard(inv).monogram); };
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(re);
  if(document.fonts && document.fonts.load) Promise.all([document.fonts.load('98px Ephesis'), document.fonts.load('600 20px "Cormorant Garamond"')]).then(re).catch(()=>{});
}

// poussière d'or
(function(){ const d = document.getElementById('dust'); for(let k=0;k<16;k++){ const e = document.createElement('i'); e.style.left = (Math.random()*96)+'%'; e.style.animationDuration = (9+Math.random()*9)+'s'; e.style.animationDelay = (-Math.random()*14)+'s'; e.style.transform = 'scale('+(.6+Math.random()*1.2)+')'; d.appendChild(e); } })();

let _lastInv = null;
async function loadInfos(){
  try{
    let data;
    if(LIVE){ const one = await waitLive(); data = one ? [one] : []; }
    else if(PREVIEW){
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_preview', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_code: PREVIEW }) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const one = await res.json(); data = one ? [one] : [];
    } else {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_invitation', { method:'POST', headers:{ apikey:SUPABASE_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: slug }) });
      if(!res.ok) throw new Error('HTTP '+res.status);
      const one = await res.json(); data = one ? [one] : [];
    }
    if(!data.length){ tabs0El.innerHTML = '<section class="tab on"><div class="body"><div class="status">Invitation introuvable.</div></div></section>'; TABS = [tabs0El.firstChild]; draw(); return; }
    const inv = data[0];
    mount(inv);
    if(inv.music_tracks && inv.music_tracks.url) window.onMusicReady(inv.music_tracks.url);
  }catch(e){
    tabs0El.innerHTML = '<section class="tab on"><div class="body"><div class="status">Impossible de charger les informations pour le moment.</div></div></section>';
  }
}
loadInfos();
